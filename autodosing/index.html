  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }
  // Cegah XSS - data dari Firebase yang berasal dari input user (nama
  // pupuk, nama greenhouse, dll) HARUS lewat ini sebelum digabung ke
  // innerHTML, supaya kalau ada yang isi tag HTML/script di form, itu
  // tampil sebagai teks biasa, bukan tereksekusi di browser orang lain.
  function escapeHtml(str){
    if(str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  // Validasi field teks bebas (nama produk, nama greenhouse, dll) - batasi
  // panjang supaya tidak ada teks super panjang yang merusak tata letak
  // atau memboroskan Firebase, dan buang whitespace berlebih di ujung.
  function validateTextField(value, label, opts){
    opts = opts || {};
    var maxLen = opts.maxLen || 100;
    var required = opts.required !== false; // default wajib diisi
    var v = (value||'').trim();
    if(required && !v) return label + ' tidak boleh kosong';
    if(v.length > maxLen) return label + ' terlalu panjang (maks ' + maxLen + ' karakter)';
    return null; // null = valid
  }
  function clearListeners(){
    listeners.forEach(function(l){ l.ref.off(l.event, l.fn); });
    listeners = [];
  }
  function listen(ref, event, fn){
    ref.on(event, fn);
    listeners.push({ref:ref, event:event, fn:fn});
  }
  function showToast(msg){
    var t = el('div','fixed bottom-20 left-1/2 -translate-x-1/2 bg-green-600 text-white px-5 py-2.5 rounded-lg text-sm font-semibold shadow-lg z-50', msg);
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2500);
  }

  function minutesToTime(m){
    var h = Math.floor(m/60), mi = m%60;
    return (h<10?'0':'')+h+':'+(mi<10?'0':'')+mi;
  }
  function timeToMinutes(t){
    var p = t.split(':');
    return parseInt(p[0],10)*60 + parseInt(p[1],10);
  }
  function myDevicesRef(){ return db.ref('users/' + uid + '/devices'); }

  //================= AUTO LOGOUT =================
  // PENTING: dulu cuma pakai setTimeout di browser - kalau PC mati/tidur,
  // timer itu ikut berhenti, jadi begitu PC nyala lagi & halaman dibuka,
  // hitungan mulai dari 0 lagi (padahal sudah berhari-hari tidak dipakai).
  // Sekarang "terakhir aktif" disimpan ke Firebase, dicek ULANG setiap
  // buka halaman (bukan cuma andalkan timer yang jalan terus-menerus) -
  // supaya tahan PC mati/tidur berapa lama pun.
  var INACTIVITY_LIMIT_MS = 2 * 60 * 60 * 1000; // 2 jam (dikembalikan ke nilai produksi - sebelumnya sempat di-set 10 menit untuk testing dan lupa dikembalikan)
  var lastActivitySavedAt = 0;

  function touchActivity(){
    var now = Date.now();
    if(now - lastActivitySavedAt < 60000) return; // throttle, max 1x/menit ke Firebase
    lastActivitySavedAt = now;
    // Sengaja diam - heartbeat dipanggil tiap interaksi, gagal sesekali
    // tidak apa (bukan operasi kritis), toast berulang akan mengganggu.
    if(uid) db.ref('users/'+uid+'/lastActivity').set(now).catch(function(){});
  }

  function checkInactivityNow(){
    if(!uid) return;
    db.ref('users/'+uid+'/lastActivity').once('value').then(function(s){
      var last = s.val();
      if(last && (Date.now() - last) > INACTIVITY_LIMIT_MS){
        auth.signOut();
      }
    // Sengaja diam - kalau gagal baca, cukup skip pengecekan inactivity
    // kali ini, jangan ganggu user dengan toast untuk operasi latar.
    }).catch(function(){});
  }

  function setupInactivityWatch(){
    ['click','keydown','touchstart','mousemove'].forEach(function(evt){
      document.addEventListener(evt, touchActivity, {passive:true});
    });
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState === 'visible') checkInactivityNow();
    });
    checkInactivityNow(); // cek DULU pakai catatan LAMA - baru setelah ini boleh ditimpa baru
    touchActivity();
    setInterval(checkInactivityNow, 60000); // cek ulang tiap menit selama halaman terbuka
  }

  //================= LOGIN =================
  function renderLogin(errorMsg, signupMode){
    clearListeners();
    root.innerHTML = '';
    var wrap = el('div','min-h-screen flex items-center justify-center p-4');
    var card = el('div','glass rounded-2xl p-8 w-full max-w-sm border border-slate-700');
    card.appendChild(el('h1','text-2xl font-extrabold brand mb-1','Ladang Woh Ijo'));
    card.appendChild(el('p','text-sm text-slate-400 mb-6','LWC100 · Control Center'));

    card.appendChild(el('label','','Email'));
    var email = el('input'); email.type='email'; email.placeholder='email@contoh.com'; email.style.marginBottom='14px';
    card.appendChild(email);

    card.appendChild(el('label','','Password'));
    var pass = el('input'); pass.type='password'; pass.placeholder='••••••••'; pass.style.marginBottom='14px';
    card.appendChild(pass);

    if(signupMode){
      card.appendChild(el('label','','Ulangi Password'));
      var pass2 = el('input'); pass2.type='password'; pass2.placeholder='••••••••'; pass2.style.marginBottom='14px';
      card.appendChild(pass2);
    }

    if(errorMsg) card.appendChild(el('div','text-red-400 text-xs mb-3',errorMsg));

    var btn = el('button','w-full py-2.5 rounded-lg bg-[#39ff14] hover:bg-[#32cc11] text-black font-bold text-sm shadow-[0_0_10px_rgba(57,255,20,.4)]', signupMode?'Daftar':'Masuk');
    btn.onclick = function(){
      btn.disabled = true; btn.textContent = 'Memproses...';

      if(signupMode){
        if(pass.value !== pass2.value){
          renderLogin('Password tidak cocok', true);
          return;
        }
        if(pass.value.length < 6){
          renderLogin('Password minimal 6 karakter', true);
          return;
        }
        var signUpDone = false;

        auth.createUserWithEmailAndPassword(email.value.trim(), pass.value)
          .then(function(cred){
            signUpDone = true;
            db.ref('userEmails/'+cred.user.uid).set(cred.user.email).catch(function(err){
              console.warn('Gagal simpan userEmails (non-fatal):', err.message);
            });
          })
          .catch(function(err){
            signUpDone = true;
            renderLogin('Daftar gagal: ' + err.message, true);
          });

        setTimeout(function(){
          if(!signUpDone){
            renderLogin('Koneksi lambat/gagal - coba lagi (cek internet Anda)', true);
          }
        }, 10000);
      } else {
        var signInDone = false;

        // PENTING: di-set TRUE di sini (sebelum signInWithEmailAndPassword
        // dipanggil), bukan di dalam .then() setelah promise resolve.
        // Kalau di-set di dalam .then(), ada race condition: Firebase SDK
        // kadang memanggil auth.onAuthStateChanged() LEBIH DULU sebelum
        // .then() ini sempat jalan, sehingga flag masih false saat
        // onAuthStateChanged dicek - akibatnya kode salah kira ini "sesi
        // lama", membaca lastActivity yang sudah basi dari Firebase, lalu
        // langsung signOut() lagi. Efeknya: login sukses sebentar, lalu
        // otomatis kembali ke layar login. Set flag TRUE di sini
        // menghilangkan race condition ini sepenuhnya.
        justLoggedInFresh = true;

        auth.signInWithEmailAndPassword(email.value.trim(), pass.value)
          .then(function(cred){
            signInDone = true;
            db.ref('userEmails/'+cred.user.uid).set(cred.user.email).catch(function(err){
              console.warn('Gagal simpan userEmails (non-fatal):', err.message);
            });
          })
          .catch(function(err){
            signInDone = true;
            justLoggedInFresh = false; // login gagal - batalkan flag
            renderLogin('Login gagal: ' + err.message);
          });

        // Jaga-jaga kalau signInWithEmailAndPassword() sendiri macet total
        // (tidak resolve ATAU reject) - terutama setelah koneksi lama tidak
        // dipakai. Tanpa ini, tombol bisa stuck "Memproses..." selamanya
        // tanpa pesan apa pun.
        setTimeout(function(){
          if(!signInDone){
            justLoggedInFresh = false; // macet total - batalkan flag biar tidak menggantung
            renderLogin('Koneksi lambat/gagal - coba lagi (cek internet Anda)');
          }
        }, 10000);
      }
    };
    card.appendChild(btn);

    // Enter di kolom email/password langsung memicu proses login/daftar,
    // sama seperti klik tombol - tidak perlu klik manual lagi.
    var enterHandler = function(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        if(!btn.disabled) btn.click();
      }
    };
    email.addEventListener('keydown', enterHandler);
    pass.addEventListener('keydown', enterHandler);
    if(signupMode) pass2.addEventListener('keydown', enterHandler);

    var toggle = el('p','text-xs text-slate-400 text-center mt-4 cursor-pointer',
      signupMode ? 'Sudah punya akun? <span class="text-green-400 font-semibold">Masuk</span>' : 'Belum punya akun? <span class="text-green-400 font-semibold">Daftar</span>');
    toggle.onclick = function(){ renderLogin(null, !signupMode); };
    card.appendChild(toggle);

    if(!signupMode){
      var forgot = el('p','text-xs text-slate-500 text-center mt-2 cursor-pointer underline','Lupa password?');
      forgot.onclick = function(){
        var em = prompt('Masukkan email akun Anda, link reset password akan dikirim ke situ:');
        if(!em || !em.trim()) return;
        auth.sendPasswordResetEmail(em.trim())
          .then(function(){ showToast('Link reset password terkirim ke ' + em.trim() + ' - cek inbox/spam'); })
          .catch(function(err){ showToast('Gagal: ' + err.message); });
      };
      card.appendChild(forgot);
    }

    wrap.appendChild(card);
    root.appendChild(wrap);
  }

  //================= APP SHELL =================
  function renderShell(){
    clearListeners();
    root.innerHTML = '';

    var wrap = el('div','max-w-4xl mx-auto p-4');

    // Header
    var header = el('div','flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-5');
    var hLeft = el('div');
    hLeft.appendChild(el('h1','text-xl font-extrabold brand','Ladang Woh Ijo'));
    hLeft.appendChild(el('p','text-xs text-slate-400 mt-0.5','LWC100 · Control Center'));
    header.appendChild(hLeft);

    var hRight = el('div','flex items-center justify-between sm:justify-end gap-2 flex-wrap relative w-full sm:w-auto');
    var deviceBtn = el('button','flex items-center gap-2 rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 text-sm');
    var deviceBtnLabel = el('span','','Pilih device...');
    deviceBtn.appendChild(deviceBtnLabel);
    deviceBtn.appendChild(el('span','text-slate-500 text-xs','▾'));
    hRight.appendChild(deviceBtn);

    var devicePanel = el('div','absolute right-0 top-12 w-72 bg-slate-900 border border-slate-700 rounded-xl shadow-xl z-50 hidden overflow-hidden');
    hRight.appendChild(devicePanel);

    if('Notification' in window){
      var notifBtn = el('button','px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700 text-sm','🔔');
      function refreshNotifBtn(){
        if(Notification.permission === 'granted'){
          notifBtn.classList.add('text-green-400');
          notifBtn.title = 'Notifikasi aktif';
        } else {
          notifBtn.classList.remove('text-green-400');
          notifBtn.title = 'Aktifkan notifikasi';
        }
      }
      refreshNotifBtn();

      function activateNotifications(){
        notifBtn.disabled = true;
        Notification.requestPermission().then(function(permission){
          refreshNotifBtn();
          if(permission !== 'granted'){
            notifBtn.disabled = false;
            return;
          }

          // Daftar juga token FCM - supaya bisa dapat notifikasi walau
          // tab ini tertutup (via server), SELAIN notifikasi langsung yang
          // sudah jalan saat tab terbuka.
          if('serviceWorker' in navigator){
            navigator.serviceWorker.register('sw.js').then(function(registration){
              var messaging = firebase.messaging();
              return registration.pushManager.getSubscription().then(function(sub){
                var cleanup = sub ? sub.unsubscribe() : Promise.resolve();
                return cleanup.then(function(){
                  // Sengaja diam - token lama mungkin memang sudah tidak
                  // ada di server, proses tetap lanjut ke token baru.
                  return messaging.deleteToken().catch(function(){}).then(function(){
                    return messaging.getToken({vapidKey: VAPID_KEY, serviceWorkerRegistration: registration});
                  });
                });
              });
            }).then(function(token){
              if(!token){ notifBtn.disabled = false; return; }
              myDevicesRef().once('value').then(function(snap){
                var ids = snap.exists() ? Object.keys(snap.val()) : [];
                var promises = ids.map(function(id){
                  return db.ref('devices/'+id+'/fcmTokens/'+uid).set(token).catch(function(err){
                    showToast('Gagal aktifkan notifikasi untuk device ini: ' + err.message);
                  });
                });
                Promise.all(promises).then(function(){
                  showToast('Notifikasi diaktifkan');
                  notifBtn.disabled = false;
                });
              }).catch(function(){ notifBtn.disabled = false; });
            }).catch(function(){
              showToast('Notifikasi aktif (versi tab terbuka saja)');
              notifBtn.disabled = false;
            });
          } else {
            showToast('Notifikasi aktif selama tab ini terbuka');
            notifBtn.disabled = false;
          }
        }).catch(function(){
          // Beberapa browser menolak/lempar error kalau requestPermission()
          // dipanggil otomatis (bukan dari klik user langsung) - JANGAN
          // sampai ini mengganggu apa pun di luar fitur notifikasi.
          notifBtn.disabled = false;
        });
      }

      // Kalau belum PERNAH ditanya sama sekali (bukan yang sudah ditolak,
      // itu tidak bisa ditanya ulang lewat kode) - tanya begitu halaman
      // dibuka, supaya user yang lupa klik lonceng tetap kepancing diminta
      // izin dari awal. DITUNDA sedikit (setTimeout) dan DIBUNGKUS try-catch
      // supaya SAMA SEKALI TIDAK BISA mengganggu proses render/login utama,
      // apa pun yang terjadi di sini.
      try{
        if(Notification.permission === 'default'){
          setTimeout(function(){
            try{ activateNotifications(); } catch(e){}
          }, 500);
        }
      } catch(e){}

      notifBtn.onclick = function(){
        if(Notification.permission !== 'granted'){
          Notification.requestPermission().then(function(permission){
            if(permission !== 'granted'){ showToast('Izin notifikasi ditolak'); refreshNotifBtn(); return; }
            activateNotifications();
          }).catch(function(err){
            showToast('Gagal minta izin notifikasi: ' + err.message);
            refreshNotifBtn();
          });
        } else {
          activateNotifications(); // sudah granted - refresh token FCM aja
        }
      };
      hRight.appendChild(notifBtn);
    }

    var logout = el('button','px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700 text-sm text-slate-300','Keluar');
    logout.onclick = function(){ auth.signOut(); };
    hRight.appendChild(logout);
    header.appendChild(hRight);
    wrap.appendChild(header);

    document.addEventListener('click', function(e){
      if(!hRight.contains(e.target)) devicePanel.classList.add('hidden');
    });
    deviceBtn.onclick = function(){ devicePanel.classList.toggle('hidden'); };

    var content = el('div','space-y-4');
    wrap.appendChild(content);
    root.appendChild(wrap);

    // Bottom nav
    var nav = el('div','fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-700 flex z-40');
    var sections = [
      ['dashboard','🏠','Dashboard'],
      ['ringkasan','🗺️','Ringkasan'],
      ['jadwal','📅','Jadwal'],
      ['panen','🌾','Panen'],
      ['analisa','🤖','Analisa AI','AI'],
      ['panduan','📖','Panduan'],
      ['riwayat','📊','Riwayat']
    ];
    if(isAdmin) sections.push(['admin','🛡️','Admin']);
    var navBtns = {};
    sections.forEach(function(s){
      var b = el('div','navbtn' + (s[0]===currentSection?' active':''));
      b.appendChild(el('div','ic',s[1]));
      var labelEl = el('div','');
      if(s[3]){
        // Label pendek di mobile (biar tidak pecah 2 baris/sempit), label
        // lengkap di layar lebih lebar.
        labelEl.innerHTML = '<span class="sm:hidden">'+s[3]+'</span><span class="hidden sm:inline">'+s[2]+'</span>';
      } else {
        labelEl.textContent = s[2];
      }
      b.appendChild(labelEl);
      b.onclick = function(){
        currentSection = s[0];
        // Sengaja diam - cuma simpan tab terakhir dibuka, tidak kritis.
        db.ref('users/'+uid+'/lastSection').set(currentSection).catch(function(){});
        Object.keys(navBtns).forEach(function(k){
          navBtns[k].className = 'navbtn' + (k===currentSection?' active':'');
        });
        renderSection(content);
      };
      navBtns[s[0]] = b;
      nav.appendChild(b);
    });
    root.appendChild(nav);

    function selectDevice(id){
      deviceId = id;
      devicePanel.classList.add('hidden');
      db.ref('users/'+uid+'/lastDevice').set(id); // ingat pilihan terakhir

      // Cek dulu bisa diakses atau tidak, supaya tidak diam-diam "kosong"
      // kalau device belum diberi akses oleh admin.
      db.ref('devices/'+id+'/info').once('value').then(function(s){
        deviceBtnLabel.textContent = (s.val() && s.val().greenhouseName) || id;

        if(!sectionRestored){
          sectionRestored = true;
          db.ref('users/'+uid+'/lastSection').once('value').then(function(s2){
            var saved = s2.val();
            var validSections = Object.keys(navBtns);
            if(saved && validSections.indexOf(saved) >= 0){
              currentSection = saved;
              Object.keys(navBtns).forEach(function(k){
                navBtns[k].className = 'navbtn' + (k===currentSection?' active':'');
              });
            }
            renderSection(content);
          }).catch(function(){ renderSection(content); });
        } else {
          renderSection(content);
        }
      }).catch(function(err){
        content.innerHTML = '';
        var warn = el('div','glass rounded-xl p-6 text-center border border-red-900');
        warn.appendChild(el('div','text-red-400 font-semibold mb-2','⚠ Tidak bisa mengakses device ini'));
        warn.appendChild(el('div','text-xs text-slate-400 mb-4', 'Device "' + id + '" belum diberi izin akses untuk akun Anda.'));

        var reqBtn = el('button','px-4 py-2 rounded-lg bg-[#39ff14] text-black font-bold text-sm','Minta Akses ke Admin');
        reqBtn.onclick = function(){
          reqBtn.disabled = true; reqBtn.textContent = 'Mengirim...';
          db.ref('accessRequests').push({
            deviceId: id,
            uid: uid,
            email: auth.currentUser.email,
            requestedAt: Math.floor(Date.now()/1000)
          }).then(function(){
            reqBtn.textContent = '✓ Permintaan terkirim, tunggu persetujuan admin';
          }).catch(function(err2){
            showToast('Gagal kirim permintaan: ' + err2.message);
            reqBtn.disabled = false; reqBtn.textContent = 'Minta Akses ke Admin';
          });
        };
        warn.appendChild(reqBtn);

        content.appendChild(warn);
        deviceBtnLabel.textContent = id + ' (tidak ada akses)';
      });
    }

    function refreshDeviceOptions(selectAfter){
      myDevicesRef().once('value').then(function(snap){
        var ids = snap.exists() ? Object.keys(snap.val()) : [];
        devicePanel.innerHTML = '';

        if(ids.length === 0){
          devicePanel.appendChild(el('div','p-4 text-xs text-slate-500 text-center','Belum ada device ditambahkan.'));
        }

        var infoPromises = ids.map(function(id){
          return db.ref('devices/'+id+'/info').once('value').then(function(s){
            var v = s.val() || {};
            var diff = Date.now() - (v.lastSeen?v.lastSeen*1000:0);
            var online = v.online && diff >= 0 && diff < 60000;
            return {id:id, name:v.greenhouseName||id, online:online};
          }).catch(function(){ return {id:id, name:id, online:false}; });
        });

        Promise.all(infoPromises).then(function(list){
          list.forEach(function(dev){
            var row = el('div','flex items-center justify-between px-3 py-2.5 hover:bg-slate-800 cursor-pointer border-b border-slate-800');
            var left = el('div','flex items-center gap-2 flex-1');
            left.appendChild(el('span','', dev.online?'🟢':'🔴'));
            left.appendChild(el('span','text-sm text-slate-200', dev.name));
            left.onclick = function(){ selectDevice(dev.id); };
            row.appendChild(left);

            var removeBtn = el('button','text-slate-600 hover:text-red-400 text-xs px-2','✕');
            removeBtn.onclick = function(e){
              e.stopPropagation();
              if(!confirm('Hapus "'+dev.name+'" dari daftar Anda? (Device itu sendiri tidak terpengaruh, cuma dihapus dari daftar pilihan Anda)')) return;
              myDevicesRef().child(dev.id).remove().then(function(){
                if(deviceId === dev.id){ deviceId = null; deviceBtnLabel.textContent = 'Pilih device...'; content.innerHTML=''; }
                refreshDeviceOptions();
              });
            };
            row.appendChild(removeBtn);

            devicePanel.appendChild(row);
          });

          var addRow = el('div','px-3 py-2.5 text-sm text-green-400 hover:bg-slate-800 cursor-pointer font-semibold','+ Tambah Device Baru');
          addRow.onclick = function(){
            devicePanel.classList.add('hidden');
            var newId = prompt('Masukkan Device ID (dari Serial Monitor firmware, atau yang sudah didaftarkan admin untuk akun Anda):');
            if(newId && newId.trim()){
              var id = newId.trim();
              var upd = {}; upd[id] = true;
              myDevicesRef().update(upd).then(function(){ refreshDeviceOptions(id); });
            }
          };
          devicePanel.appendChild(addRow);

          if(selectAfter){
            // Dipanggil eksplisit (baru saja tambah/hapus device) - langsung pakai itu
            if(ids.indexOf(selectAfter) >= 0) selectDevice(selectAfter);
            else if(ids.length > 0) selectDevice(ids[0]);
          } else {
            // Buka halaman baru - coba pulihkan device terakhir dipilih DULU,
            // baru fallback ke device pertama kalau belum pernah/tidak ada lagi.
            db.ref('users/'+uid+'/lastDevice').once('value').then(function(s){
              var last = s.val();
              if(last && ids.indexOf(last) >= 0) selectDevice(last);
              else if(ids.length > 0) selectDevice(ids[0]);
            });
          }
        });
      });
    }

    refreshDeviceOptions();
  }

  function renderSection(content){
    clearListeners();
    content.innerHTML = '';

    var noDeviceNeeded = (currentSection === 'panduan' || currentSection === 'admin' || currentSection === 'ringkasan');

    if(!noDeviceNeeded && !deviceId){
      content.appendChild(el('div','glass rounded-xl p-6 text-center text-slate-400 text-sm','Pilih atau tambahkan device dulu untuk mulai.'));
      return;
    }

    if(currentSection === 'dashboard') renderDashboard(content);
    else if(currentSection === 'ringkasan') renderRingkasan(content);
    else if(currentSection === 'jadwal') renderJadwal(content);
    else if(currentSection === 'panen') renderPanen(content);
    else if(currentSection === 'panduan') renderPanduan(content);
    else if(currentSection === 'riwayat') renderRiwayat(content);
    else if(currentSection === 'admin') renderAdmin(content);
    else if(currentSection === 'analisa') renderAnalisa(content);
  }

  //================= DASHBOARD =================
  //================= RINGKASAN (semua device) =================
  function renderRingkasan(content){
    var loadingEl = el('div','text-xs text-slate-500 text-center py-6','Memuat semua device...');
    content.appendChild(loadingEl);

    myDevicesRef().once('value').then(function(snap){
      var ids = snap.exists() ? Object.keys(snap.val()) : [];
      content.innerHTML = '';

      if(ids.length === 0){
        content.appendChild(el('div','glass rounded-xl p-6 text-center text-slate-400 text-sm','Belum ada device untuk dipantau.'));
        return;
      }

      var stack = el('div','space-y-4');
      content.appendChild(stack);

      // Sama persis 6 nilai seperti Dashboard (termasuk EC & Suhu Air)
      var sensorKeys = [
        ['ph','pH','',2,'phMin','phMax'],
        ['tds','TDS','ppm',1,'tdsMin','tdsMax'],
        ['ec','EC','µS/cm',1,null,null],
        ['roomTemp','Suhu Ruang','°C',1,'roomTempMin','roomTempMax'],
        ['humidity','Kelembapan','%',0,'roomHumMin','roomHumMax'],
        ['waterTemp','Suhu Air','°C',1,'waterTempMin','waterTempMax']
      ];

      ids.forEach(function(id){
        var card = el('div','glass rounded-xl p-4 border border-slate-700');

        var top = el('div','flex items-center justify-between mb-1 cursor-pointer flex-wrap gap-1');
        top.onclick = function(){
          deviceId = id;
          currentSection = 'dashboard';
          renderShell();
        };
        var statusText = el('span','text-sm font-semibold text-slate-400','🔄 ' + id);
        top.appendChild(statusText);
        card.appendChild(top);

        var faultBanner = el('div','rounded-lg px-3 py-2 border text-xs mb-3 hidden');
        faultBanner.style.background='rgba(248,113,113,.1)'; faultBanner.style.borderColor='#f87171'; faultBanner.style.color='#fca5a5';
        card.appendChild(faultBanner);

        var valGrid = el('div','grid grid-cols-3 sm:grid-cols-6 gap-2');
        var valEls = {};
        sensorKeys.forEach(function(sk){
          var vc = el('div','text-center bg-slate-800/40 rounded-lg py-2 px-1');
          var vv = el('div','text-base font-bold text-white','--');
          var vl = el('div','text-[10px] text-slate-400 mt-0.5', sk[1]);
          var vt = el('div','text-[9px] text-slate-500 mt-0.5','');
          vc.appendChild(vv); vc.appendChild(vl); vc.appendChild(vt);
          valGrid.appendChild(vc);
          valEls[sk[0]] = {val:vv, target:vt};
        });
        card.appendChild(valGrid);
        stack.appendChild(card);

        var base = db.ref('devices/'+id);

        Promise.all([
          base.child('info').once('value').catch(function(){return null;}),
          base.child('sensors').once('value').catch(function(){return null;}),
          base.child('health').once('value').catch(function(){return null;})
        ]).then(function(results){
          var info = results[0] ? (results[0].val()||{}) : {};
          var sensors = results[1] ? (results[1].val()||{}) : {};
          var health = results[2] ? (results[2].val()||{}) : {};

          var lastSeen = info.lastSeen ? info.lastSeen*1000 : 0;
          var diffMs = Date.now() - lastSeen;
          var online = info.online && diffMs >= 0 && diffMs < 60000;
          var lastSeenStr = lastSeen ? new Date(lastSeen).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '-';

          statusText.innerHTML = (online?'🟢 ':'🔴 ') + escapeHtml(info.greenhouseName||id) +
            ' <span class="text-slate-500 text-xs">(' + escapeHtml(info.cropName||'-') + ', HST ' + (info.hst!=null?info.hst:'-') + ')</span>' +
            '<span class="text-slate-500 text-xs block sm:inline sm:ml-2">Update terakhir: ' + lastSeenStr + '</span>';

          var issues = [];
          if(health.sht20===false) issues.push('Sensor suhu/kelembapan tidak merespon');
          if(health.ph===false) issues.push('Sensor pH tidak merespon');
          if(health.ec===false) issues.push('Sensor EC/TDS tidak merespon');
          if(health.nutrientDosingFault) issues.push('Dosing nutrisi gagal berulang - otomatis dihentikan');
          if(health.phDosingFault) issues.push('Dosing pH gagal berulang - otomatis dihentikan');
          if(health.nutrientNotCalibrated) issues.push('Pompa nutrisi belum pernah dikalibrasi');
          if(health.phNotCalibrated) issues.push('Pompa pH belum pernah dikalibrasi');
          if(health.rtc===false) issues.push('Jam RTC bermasalah');
          if(health.sdcard===false) issues.push('SD Card tidak terbaca');
          if(health.wifi===false) issues.push('WiFi terputus');

          if(issues.length){
            faultBanner.innerHTML = issues.map(function(m){ return '⚠ ' + m; }).join('<br>');
            faultBanner.classList.remove('hidden');
          }

          var hst = info.hst;

          function applyValues(targets){
            sensorKeys.forEach(function(sk){
              var raw = sensors[sk[0]];
              var slot = valEls[sk[0]];
              if(raw == null){ slot.val.textContent = '--'; return; }
              var num = Number(raw);
              slot.val.textContent = num.toFixed(sk[3]);
              var t = targets && targets[sk[0]];
              if(t){
                slot.target.textContent = 'Target: ' + t.min + ' - ' + t.max;
                slot.val.className = (num < t.min || num > t.max) ? 'text-base font-bold text-red-400' : 'text-base font-bold text-white';
              } else {
                slot.val.className = 'text-base font-bold text-white';
              }
            });
          }

          if(hst != null){
            base.child('schedule/'+hst).once('value').then(function(s){
              var sched = s.val() || {};
              var targets = {};
              sensorKeys.forEach(function(sk){
                if(sk[4] && sched[sk[4]] != null && sched[sk[5]] != null){
                  targets[sk[0]] = {min:sched[sk[4]], max:sched[sk[5]]};
                }
              });
              applyValues(targets);
            }).catch(function(){ applyValues(null); });
          } else {
            applyValues(null);
          }
        });
      });
    });
  }

  //================= DASHBOARD =================
  function renderDashboard(content){
    var base = db.ref('devices/' + deviceId);

    var statusBar = el('div','glass rounded-xl px-4 py-3 flex items-center justify-between border border-slate-700 flex-wrap gap-2');
    var statusText = el('span','text-sm font-semibold text-slate-400','🔄 Memeriksa status...');
    statusBar.appendChild(statusText);
    var modeWrap = el('div','flex items-center gap-2 w-full sm:w-auto');
    var autoBtn = el('button','tab-btn flex-1 sm:flex-none','AUTO');
    var manBtn = el('button','tab-btn flex-1 sm:flex-none','MANUAL');
    autoBtn.onclick = function(){
      var prevMode = currentMode;
      currentMode = 'auto';
      autoBtn.className = 'tab-btn flex-1 sm:flex-none active'; manBtn.className = 'tab-btn flex-1 sm:flex-none';
      base.child('command/mode').set('auto').catch(function(err){
        currentMode = prevMode;
        autoBtn.className = 'tab-btn flex-1 sm:flex-none'+(prevMode==='auto'?' active':'');
        manBtn.className = 'tab-btn flex-1 sm:flex-none'+(prevMode==='manual'?' active':'');
        showToast('Gagal ganti mode: ' + err.message + ' - coba lagi');
      });
    };
    manBtn.onclick = function(){
      var prevMode = currentMode;
      currentMode = 'manual';
      manBtn.className = 'tab-btn flex-1 sm:flex-none active'; autoBtn.className = 'tab-btn flex-1 sm:flex-none';
      base.child('command/mode').set('manual').catch(function(err){
        currentMode = prevMode;
        autoBtn.className = 'tab-btn flex-1 sm:flex-none'+(prevMode==='auto'?' active':'');
        manBtn.className = 'tab-btn flex-1 sm:flex-none'+(prevMode==='manual'?' active':'');
        showToast('Gagal ganti mode: ' + err.message + ' - coba lagi');
      });
    };
    modeWrap.appendChild(autoBtn); modeWrap.appendChild(manBtn);
    statusBar.appendChild(modeWrap);
    content.appendChild(statusBar);

    var currentMode = 'auto';

    listen(base.child('info'), 'value', function(snap){
      var v = snap.val() || {};
      var lastSeen = v.lastSeen ? v.lastSeen*1000 : 0;
      var diffMs = Date.now() - lastSeen;
      var online = v.online && diffMs >= 0 && diffMs < 60000;
      var lastSeenStr = lastSeen ? new Date(lastSeen).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '-';
      statusText.innerHTML = (online?'🟢 ':'🔴 ') + escapeHtml(v.greenhouseName||deviceId) +
        ' <span class="text-slate-500 text-xs">(' + escapeHtml(v.cropName||'-') + ', HST ' + (v.hst!=null?v.hst:'-') + '/' + (v.targetHarvestHST||'-') + ')</span>' +
        '<span class="text-slate-500 text-xs block sm:inline sm:mt-1 sm:ml-2">Update terakhir: ' + lastSeenStr + ' · Firmware: ' + escapeHtml(v.firmwareVersion||'-') + '</span>';

      if(v.hst != null && v.hst !== lastLoadedHst){
        lastLoadedHst = v.hst;
        loadTargets(v.hst);
      }
    });

    listen(base.child('controlMode'), 'value', function(snap){
      currentMode = snap.val() || 'auto';
      autoBtn.className = 'tab-btn flex-1 sm:flex-none' + (currentMode==='auto'?' active':'');
      manBtn.className = 'tab-btn flex-1 sm:flex-none' + (currentMode==='manual'?' active':'');
    });

    var faultBanner = el('div','rounded-xl px-4 py-3 border text-sm hidden');
    faultBanner.style.background='rgba(248,113,113,.1)'; faultBanner.style.borderColor='#f87171'; faultBanner.style.color='#fca5a5';
    content.appendChild(faultBanner);

    var sensorGrid = el('div','grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3');
    var sensorEls = {};
    var lastLoadedHst = null;
    var targets = {}; // key -> {min, max}

    // key -> [label, unit, decimals, scheduleMinField, scheduleMaxField]
    var sensorMeta = [
      ['ph','pH','',2,'phMin','phMax'],
      ['tds','TDS','ppm',1,'tdsMin','tdsMax'],
      ['ec','EC','µS/cm',1,null,null],
      ['roomTemp','Suhu Ruang','°C',1,'roomTempMin','roomTempMax'],
      ['humidity','Kelembapan','%',0,'roomHumMin','roomHumMax'],
      ['waterTemp','Suhu Air','°C',1,'waterTempMin','waterTempMax']
    ];

    sensorMeta.forEach(function(s){
      var card = el('div','glass rounded-xl p-3 text-center border border-slate-700 transition-colors');
      var val = el('div','text-xl font-bold text-white','--');
      var lbl = el('div','text-[11px] text-slate-400 mt-0.5', s[1] + (s[2]?(' ('+s[2]+')'):''));
      var target = el('div','text-[10px] text-slate-500 mt-1','');
      card.appendChild(val); card.appendChild(lbl); card.appendChild(target);
      sensorGrid.appendChild(card);
      sensorEls[s[0]] = {card:card, el:val, targetEl:target, dec:s[3], minField:s[4], maxField:s[5]};
    });
    content.appendChild(sensorGrid);

    function loadTargets(hst){
      base.child('schedule/'+hst).once('value').then(function(snap){
        var sched = snap.val() || {};
        targets = {};
        Object.keys(sensorEls).forEach(function(k){
          var meta = sensorEls[k];
          if(!meta.minField) return;
          var min = sched[meta.minField], max = sched[meta.maxField];
          if(min == null || max == null) return;
          targets[k] = {min:min, max:max};
          meta.targetEl.textContent = 'Target: ' + min + ' - ' + max;
        });
      });
    }

    function applyRangeColor(card, val, t){
      if(t != null && val != null && (val < t.min || val > t.max)){
        card.classList.add('sensor-alert');
      } else {
        card.classList.remove('sensor-alert');
      }
    }

    listen(base.child('sensors'), 'value', function(snap){
      var v = snap.val() || {};
      Object.keys(sensorEls).forEach(function(k){
        var raw = v[k];
        var meta = sensorEls[k];
        var numVal = (raw==null) ? null : Number(raw);
        meta.el.textContent = (numVal==null) ? '--' : numVal.toFixed(meta.dec);
        applyRangeColor(meta.card, numVal, targets[k]);
      });
    });

    var relayCard = el('div','glass rounded-xl p-4 border border-slate-700');
    relayCard.appendChild(el('h2','text-sm font-semibold text-slate-300 mb-3','⚙️ Kontrol Relay'));
    var relayGrid = el('div','grid grid-cols-1 sm:grid-cols-2 gap-2');
    var relayToggles = {};
    var overrideToggles = {};
    var overrideState = {}; // key -> {enabled, state}
    var relayBusy = {}; // key -> boolean, cegah klik ganda selama proses tulis ke Firebase
    var overrideBusy = {}; // key -> boolean, sama tapi untuk toggle override

    relayMeta.forEach(function(r){
      var row = el('div','bg-slate-800/60 rounded-lg px-3 py-2');
      var topRow = el('div','flex items-center justify-between');
      topRow.appendChild(el('span','text-sm',r.label));
      var t = el('div','toggle');
      t.appendChild(el('div','knob'));
      t.onclick = function(){
        if(relayBusy[r.key]) return; // masih memproses klik sebelumnya, abaikan

        var ovr = overrideState[r.key];
        var canControl = (currentMode === 'manual') || (r.overridable && ovr && ovr.enabled);
        if(!canControl) return;

        relayBusy[r.key] = true;
        t.style.opacity = '0.5'; // indikator visual sedang memproses

        var newState = !t.classList.contains('checked');
        if(newState) t.classList.add('checked'); else t.classList.remove('checked');

        var writePromise = (currentMode === 'manual')
          ? base.child('command/relays/'+r.key).set(newState)
          : base.child('command/relayOverride/'+r.key+'State').set(newState);

        function releaseLock(){
          // Jeda minimum 800ms setelah tulis berhasil/gagal, sebelum bisa
          // diklik lagi - cegah klik beruntun langsung nyalakan/matikan
          // relay fisik (pompa) berkali-kali dalam waktu singkat.
          setTimeout(function(){
            relayBusy[r.key] = false;
            t.style.opacity = '1';
          }, 800);
        }

        writePromise.then(releaseLock, function(err){
          if(newState) t.classList.remove('checked'); else t.classList.add('checked');
          showToast('Gagal ubah ' + r.label + ': ' + err.message);
          releaseLock();
        });
      };
      topRow.appendChild(t);
      row.appendChild(topRow);

      if(r.overridable){
        var ovrRow = el('div','flex items-center justify-between mt-2 pt-2 border-t border-slate-700');
        ovrRow.appendChild(el('span','text-[11px] text-amber-400','Override manual (walau AUTO)'));
        var ot = el('div','toggle');
        ot.style.transform = 'scale(0.8)';
        ot.appendChild(el('div','knob'));
        ot.onclick = function(){
          if(overrideBusy[r.key]) return;

          overrideBusy[r.key] = true;
          ot.style.opacity = '0.5';

          var newActive = !ot.classList.contains('checked');
          if(newActive) ot.classList.add('checked'); else ot.classList.remove('checked');

          function releaseOverrideLock(){
            setTimeout(function(){
              overrideBusy[r.key] = false;
              ot.style.opacity = '1';
            }, 800);
          }

          base.child('command/relayOverride/'+r.key+'Active').set(newActive).then(releaseOverrideLock, function(err){
            if(newActive) ot.classList.remove('checked'); else ot.classList.add('checked');
            showToast('Gagal ubah override ' + r.label + ': ' + err.message);
            releaseOverrideLock();
          });
        };
        ovrRow.appendChild(ot);
        row.appendChild(ovrRow);
        overrideToggles[r.key] = ot;
      }

      relayGrid.appendChild(row);
      relayToggles[r.key] = t;
    });
    relayCard.appendChild(relayGrid);
    relayCard.appendChild(el('p','text-[11px] text-slate-500 mt-2','Pompa dosing: aktif hanya saat mode MANUAL (demi keamanan). Growlight/Blower/Fan: bisa di-override manual sesaat walau AUTO - dosing tetap jalan normal.'));
    content.appendChild(relayCard);

    listen(base.child('relays'), 'value', function(snap){
      var v = snap.val() || {};
      Object.keys(relayToggles).forEach(function(k){
        if(v[k]) relayToggles[k].classList.add('checked');
        else relayToggles[k].classList.remove('checked');
      });
    });

    listen(base.child('command/relayOverride'), 'value', function(snap){
      var v = snap.val() || {};
      Object.keys(overrideToggles).forEach(function(k){
        var active = !!v[k+'Active'];
        overrideState[k] = { enabled: active, state: !!v[k+'State'] };
        if(active) overrideToggles[k].classList.add('checked');
        else overrideToggles[k].classList.remove('checked');
      });
    });

    var wasAnyIssue = false; // lacak transisi "belum ada masalah" -> "ada masalah baru"

    listen(base.child('health'), 'value', function(snap){
      var v = snap.val() || {};

      var groups = [
        { title: 'Sensor', items: [
          v.sht20===false ? 'Sensor suhu/kelembapan tidak merespon' : null,
          v.ph===false ? 'Sensor pH tidak merespon' : null,
          v.ec===false ? 'Sensor EC/TDS tidak merespon' : null
        ]},
        { title: 'Dosing & Kalibrasi', items: [
          v.nutrientDosingFault ? 'Dosing nutrisi gagal berulang - otomatis dihentikan' : null,
          v.phDosingFault ? 'Dosing pH gagal berulang - otomatis dihentikan' : null,
          v.nutrientNotCalibrated ? 'Pompa nutrisi A/B belum pernah dikalibrasi' : null,
          v.phNotCalibrated ? 'Pompa pH Up/Down belum pernah dikalibrasi' : null
        ]},
        { title: 'Sistem', items: [
          v.rtc===false ? 'Jam RTC bermasalah' : null,
          v.sdcard===false ? 'SD Card tidak terbaca' : null,
          v.wifi===false ? 'WiFi terputus' : null
        ]}
      ];

      faultBanner.innerHTML = '';
      var anyIssue = false;
      var allMessages = [];

      groups.forEach(function(g){
        var items = g.items.filter(function(x){ return x; });
        if(items.length === 0) return;
        anyIssue = true;
        allMessages = allMessages.concat(items);

        var section = el('div','mb-2 last:mb-0');
        section.appendChild(el('div','text-[11px] uppercase tracking-wide text-red-300 font-bold mb-1', g.title));
        items.forEach(function(msg){
          var row = el('div','flex items-start gap-2 text-sm text-red-200 mb-0.5');
          row.appendChild(el('span','','⚠'));
          row.appendChild(el('span','', msg));
          section.appendChild(row);
        });
        faultBanner.appendChild(section);
      });

      if(anyIssue){
        faultBanner.classList.remove('hidden');
      } else {
        faultBanner.classList.add('hidden');
      }

      // Notifikasi browser LANGSUNG (bukan lewat push/FCM) - cuma jalan
      // selama tab/app ini terbuka. Cuma dipicu saat TRANSISI dari "aman"
      // ke "ada masalah baru", bukan tiap kali data health diperbarui
      // (supaya tidak berulang-ulang selama fault yang sama masih berlangsung).
      //
      // PENTING: pakai ServiceWorkerRegistration.showNotification() lewat
      // sw.js yang sudah terdaftar (untuk PWA) - BUKAN new Notification()
      // langsung. new Notification() dari halaman itu memang TIDAK
      // didukung di hampir semua browser HP (sengaja oleh Chrome sejak
      // 2015 - lempar error diam-diam di background), makanya sebelumnya
      // cuma jalan di PC tapi tidak pernah di HP.
      if(anyIssue && !wasAnyIssue && Notification.permission === 'granted' && 'serviceWorker' in navigator){
        navigator.serviceWorker.ready.then(function(registration){
          registration.showNotification('⚠ LWC100 - ' + (deviceId||''), {
            body: allMessages.join(', '),
            icon: 'icon-192.png'
          });
        // Sengaja diam - kalau notifikasi lokal gagal ditampilkan, tidak
        // perlu toast tambahan (bisa dobel kalau showNotification-nya

    // Validasi rentang nilai SEBELUM dikirim ke Firebase - device fisik
    // mengeksekusi nilai ini langsung (pompa dosing sungguhan), jadi input
    // salah (titik desimal geser, kelebihan nol, min > max) bisa berakibat
    // nyata ke tanaman/alat. Batas dosis pakai kelipatan wajar dari nilai
    // default (SCHED_DEFAULTS) supaya tidak asal tebak angka.
    function validateSchedulePayload(p, rawFields){
      var errors = [];

      function isNum(v){ return typeof v === 'number' && !isNaN(v) && isFinite(v); }
      function checkNum(key, label){
        if(!isNum(p[key])){ errors.push(label + ' harus berupa angka valid'); return false; }
        return true;
      }
      function checkRange(key, label, min, max){
        if(!checkNum(key, label)) return;
        if(p[key] < min || p[key] > max) errors.push(label + ' harus di antara ' + min + '-' + max);
      }
      function checkMinLessThanMax(minKey, maxKey, label){
        if(!checkNum(minKey, label+' min') || !checkNum(maxKey, label+' max')) return;
        if(p[minKey] >= p[maxKey]) errors.push(label + ' min harus lebih kecil dari max');
      }

      checkRange('phMin','pH min',0,14);
      checkRange('phMax','pH max',0,14);
      checkMinLessThanMax('phMin','phMax','pH');

      checkRange('tdsMin','TDS min',0,2200);
      checkRange('tdsMax','TDS max',0,2200);
      checkMinLessThanMax('tdsMin','tdsMax','TDS');

      checkRange('waterTempMin','Suhu air min',0,50);
      checkRange('waterTempMax','Suhu air max',0,50);
      checkMinLessThanMax('waterTempMin','waterTempMax','Suhu air');

      checkRange('roomTempMin','Suhu ruang min',0,50);
      checkRange('roomTempMax','Suhu ruang max',0,50);
      checkMinLessThanMax('roomTempMin','roomTempMax','Suhu ruang');

      checkRange('roomHumMin','Kelembapan min',0,100);
      checkRange('roomHumMax','Kelembapan max',0,100);
      checkMinLessThanMax('roomHumMin','roomHumMax','Kelembapan');

      // Dosis maksimal wajar = 5x nilai default (100ml -> 500ml) - batas
      // ini pencegah kesalahan input ekstrem, bukan batas teknis pompa.
      var maxDoseNutrient = SCHED_DEFAULTS.nutrientDoseML * 5;
      var maxDosePh = SCHED_DEFAULTS.phDoseML * 5;
      if(checkNum('nutrientDoseML','Dosis nutrisi')){
        if(p.nutrientDoseML <= 0) errors.push('Dosis nutrisi harus lebih dari 0');
        else if(p.nutrientDoseML > maxDoseNutrient) errors.push('Dosis nutrisi terlalu besar (maks '+maxDoseNutrient+' ml, 5x default)');
      }
      if(checkNum('phDoseML','Dosis pH')){
        if(p.phDoseML <= 0) errors.push('Dosis pH harus lebih dari 0');
        else if(p.phDoseML > maxDosePh) errors.push('Dosis pH terlalu besar (maks '+maxDosePh+' ml, 5x default)');
      }

      if(checkNum('nutrientMixingTime','Waktu mixing nutrisi') && p.nutrientMixingTime <= 0) errors.push('Waktu mixing nutrisi harus lebih dari 0');
      if(checkNum('phMixingTime','Waktu mixing pH') && p.phMixingTime <= 0) errors.push('Waktu mixing pH harus lebih dari 0');

      function checkRetry(key, label){
        if(!checkNum(key, label)) return;
        if(!Number.isInteger(p[key]) || p[key] < 0 || p[key] > 10){ errors.push(label + ' harus bilangan bulat 0-10'); return; }
        // p[key] sudah lewat parseInt() di buildPayload(), yang DIAM-DIAM
        // memotong "1.6" jadi 1 (bukan error) - jadi Number.isInteger() di
        // atas selalu lolos walau user sebenarnya ketik angka desimal.
        // Cek teks MENTAH dari input-nya juga, sebelum sempat terpotong.
        if(rawFields && rawFields[key] && /[.,]/.test(rawFields[key].value)){
          errors.push(label + ' harus bilangan bulat, tidak boleh desimal (contoh: 1, bukan 1.6)');
        }
      }
      checkRetry('nutrientMaxRetry','Max retry nutrisi');
      checkRetry('phMaxRetry','Max retry pH');

      if(checkNum('nutrientMinDeltaTDS','Delta TDS min') && checkNum('nutrientMaxDeltaTDS','Delta TDS max')){
        if(p.nutrientMinDeltaTDS >= p.nutrientMaxDeltaTDS) errors.push('Delta TDS min harus lebih kecil dari max');
      }
      if(checkNum('phMinDelta','Delta pH min') && checkNum('phMaxDelta','Delta pH max')){
        if(p.phMinDelta >= p.phMaxDelta) errors.push('Delta pH min harus lebih kecil dari max');
      }

      return errors;
    }

    function buildPayload(){
      return {
        hst: currentDay,
        phMin: parseFloat(fields.phMin.value), phMax: parseFloat(fields.phMax.value),
        tdsMin: parseInt(fields.tdsMin.value,10), tdsMax: parseInt(fields.tdsMax.value,10),
        waterTempMin: parseFloat(fields.waterTempMin.value), waterTempMax: parseFloat(fields.waterTempMax.value),
        roomTempMin: parseFloat(fields.roomTempMin.value), roomTempMax: parseFloat(fields.roomTempMax.value),
        roomHumMin: parseFloat(fields.roomHumMin.value), roomHumMax: parseFloat(fields.roomHumMax.value),
        growlightEnable: glToggle.classList.contains('checked'),
        growlightOnMinute: timeToMinutes(glOnInput.value||'13:00'),
        growlightOffMinute: timeToMinutes(glOffInput.value||'14:00'),
        blowerEnable: blToggle.classList.contains('checked'),
        dosingEnable: dosToggle.classList.contains('checked'),
        manualLock: lockToggle.classList.contains('checked'),
        nutrientDoseML: parseInt(fields.nutrientDoseML.value,10),
        nutrientMixingTime: Math.round(parseFloat(fields.nutrientMixingTimeSec.value)*1000),
        nutrientMaxRetry: parseInt(fields.nutrientMaxRetry.value,10),
        nutrientMinDeltaTDS: parseInt(fields.nutrientMinDeltaTDS.value,10),
        nutrientMaxDeltaTDS: parseInt(fields.nutrientMaxDeltaTDS.value,10),
        phDoseML: parseInt(fields.phDoseML.value,10),
        phMixingTime: Math.round(parseFloat(fields.phMixingTimeSec.value)*1000),
        phMaxRetry: parseInt(fields.phMaxRetry.value,10),
        phMinDelta: parseFloat(fields.phMinDelta.value),
        phMaxDelta: parseFloat(fields.phMaxDelta.value)
      };
    }
    function bumpVersion(){ return base.child('scheduleMeta').set({version: Math.floor(Date.now()/1000)}); }

    function fillForm(d){
      d = d || {};
      function gv(k){ return d[k]!==undefined ? d[k] : SCHED_DEFAULTS[k]; }
      fields.phMin.value=gv('phMin'); fields.phMax.value=gv('phMax');
      fields.tdsMin.value=gv('tdsMin'); fields.tdsMax.value=gv('tdsMax');
      fields.waterTempMin.value=gv('waterTempMin'); fields.waterTempMax.value=gv('waterTempMax');
      fields.roomTempMin.value=gv('roomTempMin'); fields.roomTempMax.value=gv('roomTempMax');
      fields.roomHumMin.value=gv('roomHumMin'); fields.roomHumMax.value=gv('roomHumMax');
      glToggle.className='toggle'+(gv('growlightEnable')?' checked':'');
      glOnInput.value=minutesToTime(gv('growlightOnMinute'));
      glOffInput.value=minutesToTime(gv('growlightOffMinute'));
      blToggle.className='toggle'+(gv('blowerEnable')?' checked':'');
      dosToggle.className='toggle'+(gv('dosingEnable')?' checked':'');
      lockToggle.className='toggle'+(gv('manualLock')?' checked':'');
      fields.nutrientDoseML.value=gv('nutrientDoseML');
      fields.nutrientMixingTimeSec.value=gv('nutrientMixingTime')/1000;
      fields.nutrientMaxRetry.value=gv('nutrientMaxRetry');
      fields.nutrientMinDeltaTDS.value=gv('nutrientMinDeltaTDS');
      fields.nutrientMaxDeltaTDS.value=gv('nutrientMaxDeltaTDS');
      fields.phDoseML.value=gv('phDoseML');
      fields.phMixingTimeSec.value=gv('phMixingTime')/1000;
      fields.phMaxRetry.value=gv('phMaxRetry');
      fields.phMinDelta.value=gv('phMinDelta');
      fields.phMaxDelta.value=gv('phMaxDelta');
    }

    function loadDay(hst){
      currentDay = hst;
      dayInput.value = hst;
      fromInput.value = hst; toInput.value = hst;
      dialValue.textContent = hst + ' / ' + MAX_HST;
      base.child('schedule/'+hst).once('value').then(function(snap){ fillForm(snap.val()); });
    }

    prevBtn.onclick=function(){ if(currentDay>0) loadDay(currentDay-1); };
    nextBtn.onclick=function(){ if(currentDay<MAX_HST) loadDay(currentDay+1); };
    dayInput.onchange=function(){ loadDay(Math.max(0,Math.min(MAX_HST,parseInt(dayInput.value,10)||0))); };

    saveDayBtn.onclick=function(){
      var payload = buildPayload();
      var errors = validateSchedulePayload(payload, fields);
      if(errors.length > 0){
        showToast('Gagal simpan: ' + errors.join('; '));
        return;
      }
      saveDayBtn.disabled=true;
      base.child('schedule/'+currentDay).set(payload).then(bumpVersion).then(function(){
        showToast('Tersimpan untuk HST '+currentDay); saveDayBtn.disabled=false;
      }).catch(function(err){ showToast('Gagal: '+err.message); saveDayBtn.disabled=false; });
    };

    rangeBtn.onclick=function(){
      var from=Math.max(0,Math.min(MAX_HST,parseInt(fromInput.value,10)||0));
      var to=Math.max(0,Math.min(MAX_HST,parseInt(toInput.value,10)||0));
      if(from>to){ var t=from; from=to; to=t; }
      var payload=buildPayload();
      var errors = validateSchedulePayload(payload, fields);
      if(errors.length > 0){
        showToast('Gagal terapkan: ' + errors.join('; '));
        return;
      }
      if(!confirm('Terapkan ke HST '+from+'-'+to+'? ('+(to-from+1)+' hari)')) return;
      rangeBtn.disabled=true;
      var updates={};
      for(var i=from;i<=to;i++){ var p=Object.assign({},payload); p.hst=i; updates['schedule/'+i]=p; }
      base.update(updates).then(bumpVersion).then(function(){
        showToast('Diterapkan ke HST '+from+'-'+to); rangeBtn.disabled=false;
      }).catch(function(err){ showToast('Gagal: '+err.message); rangeBtn.disabled=false; });
    };

    seedBtn.onclick=function(){
      if(!confirm('Device: ' + deviceId + '\n\nIsi SEMUA 81 hari dengan default? Jadwal yang ada akan TERTIMPA.')) return;
      seedBtn.disabled=true; seedBtn.textContent='Menyimpan...';
      var updates={};
      for(var i=0;i<=MAX_HST;i++){ var p=Object.assign({},SCHED_DEFAULTS); p.hst=i; updates['schedule/'+i]=p; }
      base.update(updates).then(bumpVersion).then(function(){
        showToast('81 hari terisi default'); seedBtn.disabled=false; seedBtn.textContent='Isi 81 Hari dengan Default';
        loadDay(currentDay);
      }).catch(function(err){ showToast('Gagal: '+err.message); seedBtn.disabled=false; });
    };

    loadDay(0);
  }

    var contextData = null;

    function loadHistory(rangeSeconds){
      readingsEl.textContent = 'Memuat data sensor...';
      var startTs = rangeSeconds > 0 ? (Math.floor(Date.now()/1000) - rangeSeconds) : 0;
      var rangeLabel = rangeOptions.filter(function(o){ return o[0]==rangeSeconds; })[0][1];

      Promise.all([
        base.child('info').once('value'),
        base.child('sensors').once('value'),
        base.child('logs').orderByChild('timestamp').startAt(startTs).once('value'),
        base.child('eventLog').orderByChild('timestamp').startAt(startTs).once('value'),
        base.child('fieldActivity').orderByChild('timestamp').startAt(startTs).once('value'),
        base.child('fertilizerCatalog').once('value')
      ]).then(function(results){
        var info = results[0].val() || {};
        var sensors = results[1].val() || {};

        var logRows = [];
        results[2].forEach(function(c){ logRows.push(c.val()); });
        logRows.sort(function(a,b){ return (a.timestamp||0)-(b.timestamp||0); });

        var eventRows = [];
        results[3].forEach(function(c){ eventRows.push(c.val()); });
        eventRows.sort(function(a,b){ return (a.timestamp||0)-(b.timestamp||0); });

        var activityRows = [];
        results[4].forEach(function(c){ activityRows.push(c.val()); });
        activityRows.sort(function(a,b){ return (a.timestamp||0)-(b.timestamp||0); });

        var fertRows = [];
        results[5].forEach(function(c){ fertRows.push(c.val()); });

        function trendSummary(key, dec){
          var vals = logRows.map(function(r){ return r[key]; }).filter(function(v){ return v!=null; });
          if(vals.length < 2) return null;
          var min = Math.min.apply(null,vals), max = Math.max.apply(null,vals);
          var avg = vals.reduce(function(a,b){return a+b;},0)/vals.length;
          var first = vals[0], last = vals[vals.length-1];
          var arah = last > first ? 'naik' : (last < first ? 'turun' : 'stabil');
          return 'min ' + min.toFixed(dec) + ', max ' + max.toFixed(dec) + ', rata-rata ' + avg.toFixed(dec) + ', cenderung ' + arah + ' (dari ' + first.toFixed(dec) + ' ke ' + last.toFixed(dec) + ')';
        }

        function countDosing(prefix){
          return eventRows.filter(function(e){ return e.text && e.text.indexOf(prefix+' START') >= 0; }).length;
        }

        var notableEvents = eventRows.filter(function(e){
          return e.text && (e.text.indexOf('FAULT') >= 0 || e.text.indexOf('SAFETY') >= 0 ||
                             e.text.indexOf('MODE') >= 0 || e.text.indexOf('RECOVERY') >= 0);
        });

        var historySummary =
          'RIWAYAT SENSOR (' + rangeLabel + ', ' + logRows.length + ' bacaan):\n' +
          '- pH: ' + (trendSummary('ph',2) || 'data belum cukup') + '\n' +
          '- TDS: ' + (trendSummary('tds',0) || 'data belum cukup') + '\n' +
          '- Suhu Ruang: ' + (trendSummary('roomTemp',1) || 'data belum cukup') + '\n\n' +
          'RIWAYAT DOSING (' + rangeLabel + '):\n' +
          '- Pompa Nutrisi A dinyalakan: ' + countDosing('PUMP A') + 'x\n' +
          '- Pompa Nutrisi B dinyalakan: ' + countDosing('PUMP B') + 'x\n' +
          '- pH Up dinyalakan: ' + countDosing('PH UP') + 'x\n' +
          '- pH Down dinyalakan: ' + countDosing('PH DOWN') + 'x\n\n' +
          'KEJADIAN PENTING LAIN (' + rangeLabel + ', fault/safety/ganti mode/recovery, maks 15 terbaru):\n' +
          (notableEvents.length > 0
            ? notableEvents.slice(-15).map(function(e){
                return '- ' + new Date(e.timestamp*1000).toLocaleString('id-ID',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'short'}) + ': ' + e.text;
              }).join('\n')
            : '- Tidak ada kejadian penting tercatat, sistem berjalan normal') + '\n\n' +
          'TINDAKAN LAPANGAN YANG SUDAH DILAKUKAN (' + rangeLabel + '):\n' +
          (activityRows.length > 0
            ? activityRows.map(function(a){
                return '- ' + new Date(a.timestamp*1000).toLocaleDateString('id-ID') + ' (HST' + (a.hst!=null?a.hst:'-') + '): ' + a.activityType + (a.dose?(' - '+a.dose):'') + (a.notes?(' ('+a.notes+')'):'');
              }).join('\n')
            : '- Belum ada tindakan lapangan tercatat pada rentang ini') + '\n\n' +
          'KATALOG PUPUK/NUTRISI YANG SUDAH DIKARAKTERISASI (referensi permanen - kalau memberi saran, PRIORITASKAN produk dari daftar ini bila cocok, baru sarankan produk lain kalau memang tidak ada yang sesuai):\n' +
          (fertRows.length > 0
            ? fertRows.map(function(f){
                return '- ' + f.name + ' (bahan aktif: ' + (f.activeIngredient||'-') + ', dosis: ' + (f.dose||'-') + ', interval: ' + (f.interval||'-') + (f.usageRule?(', aturan: '+f.usageRule):'') + ')';
              }).join('\n')
            : '- Belum ada produk di katalog') + '\n';

        function loadTargetsAndRender(sched){
          sched = sched || {};
          contextData = { info: info, sensors: sensors, sched: sched, historySummary: historySummary };

          readingsEl.innerHTML =
            'pH: <b class="text-white">' + (sensors.ph!=null?sensors.ph.toFixed(2):'--') + '</b> (target ' + (sched.phMin||'-') + '-' + (sched.phMax||'-') + ') · ' +
            'TDS: <b class="text-white">' + (sensors.tds!=null?sensors.tds.toFixed(0):'--') + '</b> ppm (target ' + (sched.tdsMin||'-') + '-' + (sched.tdsMax||'-') + ') · ' +
            'Suhu: <b class="text-white">' + (sensors.roomTemp!=null?sensors.roomTemp.toFixed(1):'--') + '</b>°C · ' +
            'Hum: <b class="text-white">' + (sensors.humidity!=null?sensors.humidity.toFixed(0):'--') + '</b>%' +
            '<br>Tanaman: ' + escapeHtml(info.cropName||'-') + ' ' + escapeHtml(info.variety||'') + ', HST ' + (info.hst!=null?info.hst:'-') + '/' + (info.targetHarvestHST||'-') +
            '<br><span class="text-slate-500">Analisa pakai ' + rangeLabel.toLowerCase() + ': ' + logRows.length + ' bacaan sensor, ' + eventRows.length + ' kejadian (' + notableEvents.length + ' fault/safety/mode), ' + activityRows.length + ' tindakan lapangan, ' + fertRows.length + ' produk di katalog.</span>';
        }

        if(info.hst != null){
          base.child('schedule/'+info.hst).once('value').then(function(s){ loadTargetsAndRender(s.val()); });

    function buildPrompt(){
      var userText = textarea.value.trim();
      if(!userText){ showToast('Ceritakan dulu kondisi lapangannya'); return null; }
      if(!contextData){ showToast('Data sensor belum siap, coba lagi sesaat'); return null; }

      var s = contextData.sensors, sc = contextData.sched, i = contextData.info;

      return 'Anda adalah asisten ahli budidaya greenhouse hidroponik/fertigasi. ' +
        'Analisa kondisi berikut dan berikan tanggapan singkat, jelas, dan actionable dalam Bahasa Indonesia ' +
        '(maks 300 kata, boleh pakai poin-poin):\n\n' +
        'DATA SENSOR SAAT INI:\n' +
        '- pH: ' + (s.ph!=null?s.ph:'-') + ' (target: ' + (sc.phMin||'-') + '-' + (sc.phMax||'-') + ')\n' +
        '- TDS: ' + (s.tds!=null?s.tds:'-') + ' ppm (target: ' + (sc.tdsMin||'-') + '-' + (sc.tdsMax||'-') + ')\n' +
        '- EC: ' + (s.ec!=null?s.ec:'-') + ' µS/cm\n' +
        '- Suhu Ruang: ' + (s.roomTemp!=null?s.roomTemp:'-') + '°C (target: ' + (sc.roomTempMin||'-') + '-' + (sc.roomTempMax||'-') + ')\n' +
        '- Kelembapan: ' + (s.humidity!=null?s.humidity:'-') + '% (target: ' + (sc.roomHumMin||'-') + '-' + (sc.roomHumMax||'-') + ')\n' +
        '- Suhu Air: ' + (s.waterTemp!=null?s.waterTemp:'-') + '°C (target: ' + (sc.waterTempMin||'-') + '-' + (sc.waterTempMax||'-') + ')\n\n' +
        'INFO TANAMAN: ' + (i.cropName||'-') + ' ' + (i.variety||'') + ', HST ' + (i.hst!=null?i.hst:'-') + ' dari target panen ' + (i.targetHarvestHST||'-') + ' hari, jumlah tanaman: ' + (i.totalPlant||'-') + ' batang\n\n' +
        contextData.historySummary + '\n' +
        'KONDISI LAPANGAN (dilaporkan pengguna):\n"' + userText + '"\n\n' +
        'Tolong: (1) apakah ada korelasi antara pembacaan sensor (termasuk trennya) dengan kondisi yang dilaporkan, (2) apakah pola dosing dan kejadian penting (fault/safety) yang tercatat wajar atau mencurigakan, (3) PERHATIKAN tindakan lapangan yang SUDAH dilakukan (jangan sarankan ulang hal yang sudah dikerjakan, kecuali memang belum berhasil/perlu diulang), (4) kemungkinan penyebab, (5) saran tindakan konkret - kalau menyarankan produk/pupuk, SEBUTKAN nama produk spesifik dari katalog bila ada yang cocok (lengkap dosis & cara pakai), atau kalau perlu produk baru di luar katalog, sebutkan nama produk yang jelas + bahan aktif + dosis supaya bisa dicatat ke katalog nanti.';
    }

    askBtn.onclick = function(){
      var prompt = buildPrompt();
      if(!prompt) return;

      askBtn.disabled = true; askBtn.textContent = 'Menganalisa...';
      resultCard.classList.add('hidden');

      fetch('./ai-analyze.php', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({prompt: prompt})
      })
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.error){
          var detailStr = data.detail ? ('\n\nDetail: ' + JSON.stringify(data.detail)) : '';
          resultText.textContent = '⚠ ' + data.error + detailStr;
          resultCard.classList.remove('hidden');
          showToast('Gagal: ' + data.error + ' (detail tampil di bawah)');
        } else {
          resultText.textContent = data.text;
          resultCard.classList.remove('hidden');
        }
        askBtn.disabled = false; askBtn.textContent = 'Minta Analisa AI';

        showToast('Gagal hubungi server: ' + err.message);

      });

    exportBtn.onclick = function(){

    function exportPromptModal(prompt){
      var overlay = el('div','fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50');
      var box = el('div','bg-slate-900 border border-slate-700 rounded-xl p-4 max-w-lg w-full max-h-[80vh] flex flex-col');
      box.appendChild(el('h2','text-sm font-semibold text-white mb-2','Prompt untuk AI Lain'));
      var ta = document.createElement('textarea');
      ta.value = prompt;
      ta.readOnly = true;
      ta.style.cssText = 'width:100%;flex:1;min-height:300px;background:#1e293b;border:1px solid #334155;color:#e6eef8;border-radius:10px;padding:10px;font-size:12px;font-family:monospace;';
      box.appendChild(ta);

      var copyBtn = el('button','w-full py-2.5 mt-3 rounded-lg bg-[#39ff14] text-black font-bold text-sm','📋 Copy ke Clipboard');
      copyBtn.onclick = function(){
        ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
        try{
          var ok = document.execCommand('copy');
          if(ok){
            copyBtn.textContent = '✓ Tersalin!';
            setTimeout(function(){ copyBtn.textContent = '📋 Copy ke Clipboard'; }, 2000);
          } else {
            showToast('Gagal copy otomatis - pilih teks manual lalu copy sendiri');
          }
        } catch(e){
          showToast('Gagal copy otomatis - pilih teks manual lalu copy sendiri');

      };
      box.appendChild(copyBtn);

      var closeBtn = el('button','w-full py-2 mt-2 rounded-lg bg-slate-800 border border-slate-700 text-sm text-slate-300','Tutup');
      closeBtn.onclick = function(){ overlay.remove(); };
      box.appendChild(closeBtn);
      overlay.appendChild(box);
      document.body.appendChild(overlay);
      ta.focus(); ta.select();
    }
  }

    otaBtn.onclick = function(){

      var url = otaUrlInput.value.trim();
      if(!url){ showToast('Isi URL firmware dulu'); return; }
      if(!confirm('Kirim perintah update firmware ke device "' + deviceId + '"?\n\nURL: ' + url + '\n\nDevice akan restart otomatis kalau berhasil. Pastikan file sudah benar sebelum lanjut.')) return;

      otaBtn.disabled = true; otaBtn.textContent = 'Mengirim perintah...';
      db.ref('devices/'+deviceId+'/command').update({
        otaUrl: url,
        otaRequestedAt: Math.floor(Date.now()/1000)
      }).then(function(){
        showToast('Perintah update terkirim - pantau Serial Monitor / status device');
        otaBtn.disabled = false; otaBtn.textContent = 'Kirim Perintah Update';
      }).catch(function(err){
        showToast('Gagal: ' + err.message);
        otaBtn.disabled = false; otaBtn.textContent = 'Kirim Perintah Update';
      });
    };

    var backupCard = el('div','glass rounded-xl p-4 border border-slate-700 mb-4');
    backupCard.appendChild(el('h2','text-sm font-semibold text-slate-300 mb-1','💾 Backup Database'));
    backupCard.appendChild(el('p','text-xs text-slate-500 mb-3','Ambil SEMUA data device (semua pelanggan) jadi 1 file JSON, tersimpan di HP/laptop Anda.'));
    var backupBtn = el('button','w-full py-2.5 rounded-lg bg-[#39ff14] text-black font-bold text-sm','⬇ Backup Sekarang');
    backupCard.appendChild(backupBtn);
    content.appendChild(backupCard);

    backupBtn.onclick = function(){
      backupBtn.disabled = true; backupBtn.textContent = 'Mengambil semua data...';
      db.ref('devices').once('value').then(function(snap){
        var data = snap.val() || {};
        var json = JSON.stringify(data, null, 2);
        var blob = new Blob([json], {type:'application/json'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'lwc100_backup_' + new Date().toISOString().slice(0,10) + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showToast('Backup berhasil (' + Object.keys(data).length + ' device)');
        backupBtn.disabled = false; backupBtn.textContent = '⬇ Backup Sekarang';
      }).catch(function(err){
        showToast('Gagal backup: ' + err.message);
        backupBtn.disabled = false; backupBtn.textContent = '⬇ Backup Sekarang';
      });
    };

    var card = el('div','glass rounded-xl p-4 border border-slate-700');
    card.appendChild(el('h2','text-sm font-semibold text-slate-300 mb-1','🛡️ Permintaan Akses Masuk'));
    card.appendChild(el('p','text-xs text-slate-500 mb-3','Setujui = pelanggan bisa langsung buka device itu. Tolak = permintaan dihapus.'));
    var list = el('div','space-y-2');
    card.appendChild(list);
    content.appendChild(card);

    function load(){
      list.innerHTML = '';
      db.ref('accessRequests').once('value').then(function(snap){
        var reqs = [];
        snap.forEach(function(c){ reqs.push({key:c.key, val:c.val()}); });

        if(reqs.length === 0){
          list.appendChild(el('div','text-xs text-slate-500 text-center py-4','Tidak ada permintaan tertunda.'));
          return;
        }

        reqs.forEach(function(r){
          var row = el('div','bg-slate-800/60 rounded-lg p-3');
          row.appendChild(el('div','text-sm text-white font-semibold', 'Device: ' + r.val.deviceId));
          row.appendChild(el('div','text-xs text-slate-400 mb-2', r.val.email + ' · ' + new Date(r.val.requestedAt*1000).toLocaleString('id-ID')));

          var btnRow = el('div','flex gap-2');
          var approveBtn = el('button','flex-1 py-1.5 rounded-lg bg-[#39ff14] text-black text-xs font-bold','✓ Setujui');
          var rejectBtn = el('button','flex-1 py-1.5 rounded-lg bg-slate-700 text-slate-300 text-xs font-semibold','✕ Tolak');

          approveBtn.onclick = function(){
            approveBtn.disabled = true; rejectBtn.disabled = true;
            var upd = {}; upd[r.val.uid] = true;
            db.ref('deviceOwners/'+r.val.deviceId).update(upd).then(function(){
              return db.ref('accessRequests/'+r.key).remove();
            }).then(function(){
              showToast('Disetujui - ' + r.val.email + ' sekarang bisa akses ' + r.val.deviceId);
              load();
            }).catch(function(err){
              showToast('Gagal: ' + err.message);
              approveBtn.disabled = false; rejectBtn.disabled = false;
            });
          };

          rejectBtn.onclick = function(){
            if(!confirm('Tolak permintaan dari ' + r.val.email + ' untuk device ' + r.val.deviceId + '?')) return;
            db.ref('accessRequests/'+r.key).remove().then(function(){
              showToast('Ditolak');
              load();
            });
          };

          btnRow.appendChild(approveBtn); btnRow.appendChild(rejectBtn);
          row.appendChild(btnRow);
          list.appendChild(row);
        });
      });
    }

    load();

    // ---- Kelola Pengguna & Akses ----
    var userCard = el('div','glass rounded-xl p-4 border border-slate-700 mt-4');
    userCard.appendChild(el('h2','text-sm font-semibold text-slate-300 mb-1','👥 Kelola Pengguna & Akses'));
    userCard.appendChild(el('p','text-xs text-slate-500 mb-3','Akun yang belum diketahui emailnya (tombol tidak aktif) sengaja dikunci demi keamanan - bisa jadi akun device sendiri (bukan pelanggan), bukan bug. Akun lama yang daftar sebelum fitur ini ada baru muncul emailnya setelah login ulang sekali.'));
    var userList = el('div','space-y-3');
    userCard.appendChild(userList);
    content.appendChild(userCard);

    function loadUserList(){
      userList.innerHTML = '<div class="text-xs text-slate-500 text-center py-3">Memuat...</div>';

      Promise.all([
        db.ref('deviceOwners').once('value'),
        db.ref('userEmails').once('value')
      ]).then(function(results){
        var ownersData = results[0].val() || {};
        var emailsData = results[1].val() || {};

        // Kelompokkan per UID: {uid: [deviceId, deviceId, ...]}
        var byUid = {};
        Object.keys(ownersData).forEach(function(deviceId){
          Object.keys(ownersData[deviceId]).forEach(function(uidKey){
            if(!byUid[uidKey]) byUid[uidKey] = [];
            byUid[uidKey].push(deviceId);
          });
        });

        var uids = Object.keys(byUid);
        userList.innerHTML = '';

        if(uids.length === 0){
          userList.appendChild(el('div','text-xs text-slate-500 text-center py-3','Belum ada pengguna.'));
          return;
        }

        uids.forEach(function(uidKey){
          var email = emailsData[uidKey] || null;
          var devices = byUid[uidKey];

          var row = el('div','bg-slate-800/60 rounded-lg p-3');
          var top = el('div','flex justify-between items-start gap-2 mb-2');

          if(email){
            top.appendChild(el('div','text-sm text-white font-semibold', email));
          } else {
            var unknownWrap = el('div','flex-1');
            unknownWrap.appendChild(el('div','text-sm text-amber-400 font-semibold', '⚠ Email tidak diketahui (' + uidKey.slice(0,8) + '...)'));
            unknownWrap.appendChild(el('div','text-[11px] text-slate-500','Bisa jadi akun DEVICE sendiri (bukan pelanggan) - JANGAN dihapus kalau tidak yakin.'));
            top.appendChild(unknownWrap);
          }

          var delAccBtn = el('button','text-xs px-2 py-1 rounded bg-red-950 border border-red-800 text-red-400 flex-shrink-0','🗑 Hapus Akun');
          if(!email){
            // Tidak tahu email = tidak tahu ini akun pelanggan atau akun
            // sistem (misal device service account) - JANGAN kasih tombol
            // hapus aktif, terlalu berisiko salah hapus akun kritikal.
            delAccBtn.disabled = true;
            delAccBtn.title = 'Email tidak diketahui - tidak aman dihapus dari sini';
            delAccBtn.classList.add('opacity-40');
          }
          delAccBtn.onclick = function(){
            if(!email) return;
            if(!confirm((email||uidKey) + '\n\nHapus akun ini SEPENUHNYA? Login mereka akan mati total, akses ke SEMUA device (' + devices.length + ' device) ikut hilang. TIDAK BISA dibatalkan.')) return;
            delAccBtn.disabled = true; delAccBtn.textContent = 'Menghapus...';

            auth.currentUser.getIdToken().then(function(callerIdToken){
              return fetch('./delete-user.php', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({uid: uidKey, callerIdToken: callerIdToken})
              });
            }).then(function(r){ return r.json(); }).then(function(data){
              if(data.error){
                showToast('Gagal: ' + data.error);
                delAccBtn.disabled = false; delAccBtn.textContent = '🗑 Hapus Akun';
                return;
              }
              // Bersihkan sisa data terkait di RTDB juga (akses device + email)
              var cleanup = devices.map(function(d){ return db.ref('deviceOwners/'+d+'/'+uidKey).remove(); });
              cleanup.push(db.ref('userEmails/'+uidKey).remove());
              Promise.all(cleanup).then(function(){
                showToast('Akun dihapus');
                loadUserList();
              });
            }).catch(function(err){
              showToast('Gagal hubungi server: ' + err.message);
              delAccBtn.disabled = false; delAccBtn.textContent = '🗑 Hapus Akun';
            });
          };
          top.appendChild(delAccBtn);
          row.appendChild(top);

          var devList = el('div','space-y-1');
          devices.forEach(function(deviceId){
            var devRow = el('div','flex justify-between items-center text-xs bg-slate-900/50 rounded px-2 py-1.5');
            devRow.appendChild(el('span','text-slate-300', deviceId));
            var revokeBtn = el('button','text-slate-500 hover:text-red-400 px-1','✕ Cabut akses');
            if(!email){
              revokeBtn.disabled = true;
              revokeBtn.title = 'Email tidak diketahui - bisa jadi akun device sendiri, tidak aman dicabut dari sini';
              revokeBtn.classList.add('opacity-40');
            }
            revokeBtn.onclick = function(){
              if(!email) return;
              if(!confirm('Cabut akses ' + (email||uidKey) + ' ke device ' + deviceId + '?')) return;
              db.ref('deviceOwners/'+deviceId+'/'+uidKey).remove().then(function(){
                showToast('Akses dicabut');
                loadUserList();
              });
            };
            devRow.appendChild(revokeBtn);
            devList.appendChild(devRow);
          });
          row.appendChild(devList);

          userList.appendChild(row);
        });
      });
    }

    loadUserList();
  }
