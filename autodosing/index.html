    formCard.appendChild(gradeHead);

    var gradeRows = el('div','space-y-2 mb-2');
    formCard.appendChild(gradeRows);

    var rows = [];

    function addGradeRow(name, kg, price){
      var row = el('div','grid grid-cols-12 gap-2 items-center');
      var nameInput = el('input','col-span-3'); nameInput.type='text'; nameInput.placeholder='A'; nameInput.value = name||'';
      var kgInput = el('input','col-span-3'); kgInput.type='number'; kgInput.step='0.1'; kgInput.placeholder='0'; kgInput.value = kg||'';
      var priceInput = el('input','col-span-4'); priceInput.type='number'; priceInput.step='100'; priceInput.placeholder='0'; priceInput.value = price||'';
      var removeBtn = el('button','col-span-2 text-red-400 text-xs py-2','✕ Hapus');
      removeBtn.onclick = function(){
        rows = rows.filter(function(r){ return r.row !== row; });
        row.remove();
      };
      row.appendChild(nameInput); row.appendChild(kgInput); row.appendChild(priceInput); row.appendChild(removeBtn);
      gradeRows.appendChild(row);
      rows.push({row:row, nameInput:nameInput, kgInput:kgInput, priceInput:priceInput});
    }

    addGradeRow('A','','');
    addGradeRow('B','','');

    var addRowBtn = el('button','w-full py-2 rounded-lg bg-slate-800 border border-slate-700 text-xs font-semibold text-slate-300 mb-3','+ Tambah Grade');
    addRowBtn.onclick = function(){ addGradeRow('','',''); };
    formCard.appendChild(addRowBtn);

    var notesWrap = el('div','mb-3');
    notesWrap.appendChild(el('label','','Catatan (opsional)'));
    var notesInput = el('input'); notesInput.type='text'; notesInput.placeholder='Kualitas, kendala, dll';
    notesWrap.appendChild(notesInput);
    formCard.appendChild(notesWrap);

    // ---- Upload foto hasil panen (opsional) ----
    var imgWrap = el('div','mb-3');
    imgWrap.appendChild(el('label','','Foto Hasil Panen (opsional)'));
    var imgInput = el('input'); imgInput.type='file'; imgInput.accept='image/jpeg,image/png,image/webp,image/gif';
    imgWrap.appendChild(imgInput);
    var imgPreview = el('img','mt-2 rounded-lg max-h-40 hidden');
    imgWrap.appendChild(imgPreview);
    var imgRemoveBtn = el('button','text-xs text-red-400 mt-1 hidden','✕ Hapus foto');
    imgWrap.appendChild(imgRemoveBtn);
    formCard.appendChild(imgWrap);

    var selectedImageFile = null; // file BARU yang dipilih user (belum diupload)
    var existingImageUrl = null;  // URL foto YANG SUDAH ADA (saat mode edit), tetap dipakai kalau tidak diganti
    var removeExistingImage = false; // user klik "hapus foto" saat edit

    imgInput.onchange = function(){
      if(imgInput.files && imgInput.files[0]){
        selectedImageFile = imgInput.files[0];
        removeExistingImage = false;
        var reader = new FileReader();
        reader.onload = function(e){
          imgPreview.src = e.target.result;
          imgPreview.classList.remove('hidden');
          imgRemoveBtn.classList.remove('hidden');
        };
        reader.readAsDataURL(selectedImageFile);
      }
    };
    imgRemoveBtn.onclick = function(){
      selectedImageFile = null;
      existingImageUrl = null;
      removeExistingImage = true;
      imgInput.value = '';
      imgPreview.classList.add('hidden');
      imgRemoveBtn.classList.add('hidden');
    };

    var totalPreview = el('div','text-sm text-green-400 font-semibold mb-3','Total: 0 kg - Rp 0');
    formCard.appendChild(totalPreview);

    function updatePreview(){
      var totalKg = 0, totalRp = 0;
      rows.forEach(function(r){
        var kg = parseFloat(r.kgInput.value)||0;
        var price = parseFloat(r.priceInput.value)||0;
        totalKg += kg;
        totalRp += kg*price;
      });
      totalPreview.textContent = 'Total: ' + totalKg.toFixed(1) + ' kg - Rp ' + totalRp.toLocaleString('id-ID');
    }
    gradeRows.addEventListener('input', updatePreview);

    var editingKey = null; // null = mode tambah baru, isi = mode edit entri ini

    var saveBtn = el('button','w-full py-2.5 rounded-lg bg-[#39ff14] text-black font-bold text-sm','Simpan Hasil Panen');
    formCard.appendChild(saveBtn);
    var cancelEditBtn = el('button','w-full py-2 rounded-lg bg-slate-800 border border-slate-700 text-xs font-semibold text-slate-300 mt-2 hidden','Batal Edit');
    formCard.appendChild(cancelEditBtn);
    content.appendChild(formCard);

    function resetForm(){
      editingKey = null;
      dateInput.value = new Date().toISOString().slice(0,10);
      gradeRows.innerHTML = ''; rows = [];
      addGradeRow('A','',''); addGradeRow('B','','');
      notesInput.value = '';
      selectedImageFile = null; existingImageUrl = null; removeExistingImage = false;
      imgInput.value = '';
      imgPreview.classList.add('hidden');
      imgRemoveBtn.classList.add('hidden');
      saveBtn.textContent = 'Simpan Hasil Panen';
      cancelEditBtn.classList.add('hidden');
      updatePreview();
    }

    cancelEditBtn.onclick = resetForm;

    saveBtn.onclick = function(){
      var grades = rows.map(function(r){
        return {
          name: r.nameInput.value || '-',
          kg: parseFloat(r.kgInput.value)||0,
          pricePerKg: parseFloat(r.priceInput.value)||0
        };
      }).filter(function(g){ return g.kg > 0; });

      if(grades.length === 0){
        showToast('Isi minimal 1 grade dengan kg > 0');
        return;
      }

      var totalKg = grades.reduce(function(s,g){ return s+g.kg; }, 0);
      var totalRevenue = grades.reduce(function(s,g){ return s+(g.kg*g.pricePerKg); }, 0);

      saveBtn.disabled = true;
      var originalLabel = saveBtn.textContent;

      function finishSave(imageUrl){
        var payload = {
          date: dateInput.value,
          timestamp: Math.floor(new Date(dateInput.value).getTime()/1000),
          grades: grades,
          totalKg: totalKg,
          totalRevenue: totalRevenue,
          notes: notesInput.value || '',
          imageUrl: imageUrl || null
        };

        var writeOp = editingKey
          ? base.child('harvestLog/'+editingKey).set(payload)
          : base.child('harvestLog').push(payload);

        writeOp.then(function(){
          showToast(editingKey ? 'Hasil panen diperbarui' : 'Hasil panen tersimpan');
          saveBtn.disabled = false;
          resetForm();
          loadHarvestHistory();
        }).catch(function(err){
          showToast('Gagal: ' + err.message);
          saveBtn.disabled = false;
          saveBtn.textContent = originalLabel;
        });
      }

      if(selectedImageFile){
        saveBtn.textContent = 'Mengupload foto...';
        auth.currentUser.getIdToken().then(function(idToken){
          var formData = new FormData();
          formData.append('image', selectedImageFile);
          formData.append('callerIdToken', idToken);
          formData.append('deviceId', deviceId);
          return fetch('./upload-image.php', { method: 'POST', body: formData });
        }).then(function(r){ return r.json(); }).then(function(data){
          if(data.error){
            showToast('Gagal upload foto: ' + data.error);
            saveBtn.disabled = false;
            saveBtn.textContent = originalLabel;
            return;
          }
          saveBtn.textContent = originalLabel;
          finishSave(data.url);
        }).catch(function(err){
          showToast('Gagal upload foto: ' + err.message);
          saveBtn.disabled = false;
          saveBtn.textContent = originalLabel;
        });
      } else if(removeExistingImage){
        finishSave(null);
      } else {
        finishSave(existingImageUrl); // edit tanpa ganti foto - pakai URL lama
      }
    };

    var historyCard = el('div','glass rounded-xl p-4 border border-slate-700 mt-4');
    historyCard.appendChild(el('h2','text-sm font-semibold text-slate-300 mb-3','📜 Riwayat Panen'));
    var historyList = el('div','space-y-2');
    historyCard.appendChild(historyList);
    content.appendChild(historyCard);

    function loadHarvestHistory(){
      historyList.innerHTML = '';
      base.child('harvestLog').orderByChild('timestamp').once('value').then(function(snap){
        var entries = [];
        snap.forEach(function(c){ entries.push({key: c.key, val: c.val()}); });
        entries.reverse();

        if(entries.length === 0){
          historyList.appendChild(el('div','text-xs text-slate-500 text-center py-3','Belum ada catatan panen.'));
          return;
        }

        entries.forEach(function(entry){
          var e = entry.val;
          var key = entry.key;
          var card = el('div','bg-slate-800/60 rounded-lg p-3');
          var top = el('div','flex justify-between items-center mb-1');
          top.appendChild(el('span','text-sm font-semibold text-white', escapeHtml(e.date)));
          top.appendChild(el('span','text-sm text-green-400 font-semibold', (e.totalKg||0).toFixed(1)+' kg'));
          card.appendChild(top);

          var gradeStr = (e.grades||[]).map(function(g){ return escapeHtml(g.name)+': '+g.kg+'kg @Rp'+g.pricePerKg.toLocaleString('id-ID'); }).join(', ');
          card.appendChild(el('div','text-xs text-slate-400 mb-1', gradeStr));
          card.appendChild(el('div','text-xs text-amber-400 font-semibold', 'Rp ' + (e.totalRevenue||0).toLocaleString('id-ID')));
          if(e.notes) card.appendChild(el('div','text-xs text-slate-500 mt-1 italic', escapeHtml(e.notes)));

          if(e.imageUrl){
            var thumb = el('img','mt-2 rounded-lg max-h-32 cursor-pointer');
            thumb.src = e.imageUrl;
            thumb.onclick = function(){ window.open(e.imageUrl, '_blank'); };
            card.appendChild(thumb);
          }

          var btnRow = el('div','flex gap-2 mt-2 pt-2 border-t border-slate-700');
          var editBtn = el('button','flex-1 text-xs py-1.5 rounded bg-slate-700 text-slate-200 font-semibold','✏️ Edit');
          var delBtn = el('button','flex-1 text-xs py-1.5 rounded bg-red-950 border border-red-800 text-red-400 font-semibold','🗑 Hapus');

          editBtn.onclick = function(){
            editingKey = key;
            dateInput.value = e.date;
            gradeRows.innerHTML = ''; rows = [];
            (e.grades||[]).forEach(function(g){ addGradeRow(g.name, g.kg, g.pricePerKg); });
            if((e.grades||[]).length === 0){ addGradeRow('A','',''); }
            notesInput.value = e.notes || '';
            selectedImageFile = null;
            removeExistingImage = false;
            existingImageUrl = e.imageUrl || null;
            imgInput.value = '';
            if(e.imageUrl){
              imgPreview.src = e.imageUrl;
              imgPreview.classList.remove('hidden');
              imgRemoveBtn.classList.remove('hidden');
            } else {
              imgPreview.classList.add('hidden');
              imgRemoveBtn.classList.add('hidden');
            }
            saveBtn.textContent = 'Update Hasil Panen';
            cancelEditBtn.classList.remove('hidden');
            updatePreview();
            formCard.scrollIntoView({behavior:'smooth', block:'start'});
          };

          delBtn.onclick = function(){
            if(!confirm('Hapus catatan panen tanggal ' + e.date + '? Tidak bisa dibatalkan.')) return;
            delBtn.disabled = true; delBtn.textContent = 'Menghapus...';
            base.child('harvestLog/'+key).remove().then(function(){
              showToast('Catatan panen dihapus');
              if(editingKey === key) resetForm();
              loadHarvestHistory();
            }).catch(function(err){
              showToast('Gagal hapus: ' + err.message);
              delBtn.disabled = false; delBtn.textContent = '🗑 Hapus';
            });
          };

          btnRow.appendChild(editBtn); btnRow.appendChild(delBtn);
          card.appendChild(btnRow);

          historyList.appendChild(card);
        });
      });
    }

    loadHarvestHistory();
  }

  //================= RIWAYAT =================
  function renderRiwayat(content){
    var base = db.ref('devices/' + deviceId);
    var allLogs = [];
    var dosingMarks = []; // timestamp tiap kali dosing NUTRISI mulai (A atau B)
    var phMarks = []; // timestamp tiap kali dosing pH Up/Down mulai
    var currentTab = 'all';
    var chart = null;

    // SATU grafik. Default menampilkan semua sensor.
    // Tampilan dikembalikan mengikuti tema asli: judul di kiri, filter di kanan.
    var chartCard = el('div','glass rounded-xl p-4 border border-slate-700');
    var chartHead = el('div','flex flex-wrap items-center justify-between gap-2 mb-3');
    var chartTitle = el('h2','text-sm font-semibold text-slate-300','📈 Grafik Riwayat (200 terakhir)');
    chartHead.appendChild(chartTitle);

    var tabRow = el('div','flex gap-2 flex-wrap');
    var tabs = [['all','Semua'],['tds','TDS'],['ph','pH'],['roomTemp','Suhu Ruang'],['waterTemp','Suhu Air'],['humidity','Kelembapan']];
    var colors = {tds:'#39ff14',ph:'#ff00ff',roomTemp:'#ff6347',waterTemp:'#38bdf8',humidity:'#fbbf24'};
    var tabBtns = {};

    tabs.forEach(function(t){
      var b = el('button','tab-btn'+(t[0]===currentTab?' active':''), t[1]);
      b.type = 'button';
      b.title = t[0]==='all' ? 'Tampilkan semua sensor' : 'Tampilkan hanya '+t[1];
      b.onclick = function(){
        currentTab = t[0];
        Object.keys(tabBtns).forEach(function(k){ tabBtns[k].className='tab-btn'+(k===currentTab?' active':''); });
        drawChart();
      };
      tabBtns[t[0]] = b;
      tabRow.appendChild(b);
    });
    chartHead.appendChild(tabRow);
    chartCard.appendChild(chartHead);

    // ---- Pilih tanggal - supaya bisa lihat riwayat LAMA, bukan cuma
    // 200 bacaan TERBARU (yang bisa saja semuanya dari hari ini/kemarin
    // kalau datanya padat, membuat data seminggu lalu tidak terlihat).
    var chartDateWrap = el('div','flex items-center gap-2 mb-3 flex-wrap');
    var chartPrevBtn = el('button','tab-btn','◀');
    chartPrevBtn.type = 'button';
    chartPrevBtn.title = 'Hari sebelumnya';
    chartDateWrap.appendChild(chartPrevBtn);
    chartDateWrap.appendChild(el('label','text-xs text-slate-400','Tanggal:'));
    var chartDateInput = document.createElement('input');
    chartDateInput.type = 'date';
    chartDateInput.style.cssText = 'background:#1e293b;border:1px solid #334155;color:#e6eef8;border-radius:8px;padding:6px 10px;font-size:13px;';
    chartDateWrap.appendChild(chartDateInput);
    var chartNextBtn = el('button','tab-btn','▶');
    chartNextBtn.type = 'button';
    chartNextBtn.title = 'Hari berikutnya';
    chartDateWrap.appendChild(chartNextBtn);
    var chartDateBtn = el('button','tab-btn','Lihat Tanggal Ini');
    chartDateBtn.type = 'button';
    chartDateWrap.appendChild(chartDateBtn);
    var chartLatestBtn = el('button','tab-btn','Kembali ke Terbaru');
    chartLatestBtn.type = 'button';
    chartLatestBtn.style.display = 'none';
    chartDateWrap.appendChild(chartLatestBtn);
    chartCard.appendChild(chartDateWrap);
    chartCard.appendChild(el('p','text-[11px] text-slate-500 mb-2','🔺 Segitiga oranye di garis TDS = dosing Nutrisi dimulai. Kalau TDS turun jelas setelahnya, tanaman menyerap baik. 🔷 Belah ketupat ungu di garis pH = dosing pH dimulai - lihat apakah pH berubah sesuai target setelahnya.'));


    var canvasWrap = el('div');
    canvasWrap.style.height='320px';
    canvasWrap.style.position='relative';
    var canvas = document.createElement('canvas');
    canvas.setAttribute('aria-label','Grafik riwayat sensor');
    canvasWrap.appendChild(canvas);
    chartCard.appendChild(canvasWrap);
    content.appendChild(chartCard);

    function makeDataset(key, label, axisId){
      var c = colors[key];
      return {
        label: label,
        data: allLogs.map(function(l){ return l[key]!=null ? Number(l[key]) : null; }),
        borderColor: c,
        backgroundColor: c+'16',
        tension:.35,
        borderWidth:2.2,
        fill:false,
        spanGaps:true,
        pointRadius:1.8,
        pointHoverRadius:5,
        pointBackgroundColor:c,
        pointBorderColor:'#0b1f16',
        pointBorderWidth:1,
        yAxisID:axisId
      };
    }

    function drawChart(){
      var labels = allLogs.map(function(l){
        var d = new Date(l.timestamp*1000);
        return d.toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
      });
      if(chart) chart.destroy();

      var datasets;
      if(currentTab==='all'){
        datasets=[
          makeDataset('tds','TDS','yTds'),
          makeDataset('ph','pH','yPh'),
          makeDataset('roomTemp','Suhu Ruang','yTemp'),
          makeDataset('waterTemp','Suhu Air','yTemp'),
          makeDataset('humidity','Kelembapan','yHumidity')
        ];
      }else{
        var names={tds:'TDS',ph:'pH',roomTemp:'Suhu Ruang',waterTemp:'Suhu Air',humidity:'Kelembapan'};
        datasets=[makeDataset(currentTab,names[currentTab],'ySingle')];
      }

      // Tandai titik dosing PUPUK NUTRISI langsung di garis TDS - supaya
      // pola "naik lalu turun" (tanda tanaman menyerap) kelihatan jelas
      // tanpa perlu cocok-cocokkan manual dengan Riwayat Kejadian.
      if((currentTab==='all' || currentTab==='tds') && dosingMarks.length > 0){
        var tdsAxisId = currentTab==='all' ? 'yTds' : 'ySingle';
        var markerData = allLogs.map(function(){ return null; });

        dosingMarks.forEach(function(markTs){
          // Cari indeks bacaan sensor TERDEKAT dengan waktu dosing ini
          var closestIdx = -1, closestDiff = Infinity;
          allLogs.forEach(function(l, i){
            var diff = Math.abs((l.timestamp||0) - markTs);
            if(diff < closestDiff){ closestDiff = diff; closestIdx = i; }
          });
          if(closestIdx >= 0 && allLogs[closestIdx].tds != null){
            markerData[closestIdx] = Number(allLogs[closestIdx].tds);
          }
        });

        datasets.push({
          label: '💧 Dosing Nutrisi',
          data: markerData,
          borderColor: 'transparent',
          backgroundColor: '#fb923c',
          showLine: false,
          pointRadius: 7,
          pointHoverRadius: 9,
          pointStyle: 'triangle',
          pointBorderColor: '#fff',
          pointBorderWidth: 1.5,
          yAxisID: tdsAxisId
        });
      }

      // Tandai dosing pH Up/Down di garis pH (bukan TDS) - supaya bisa
      // lihat "apakah pH berubah setelah didosing", sesuai jenis datanya
      // sendiri. Warna/bentuk beda dari penanda nutrisi supaya tidak
      // tertukar.
      if((currentTab==='all' || currentTab==='ph') && phMarks.length > 0){
        var phAxisId2 = currentTab==='all' ? 'yPh' : 'ySingle';
        var phMarkerData = allLogs.map(function(){ return null; });

        phMarks.forEach(function(markTs){
          var closestIdx = -1, closestDiff = Infinity;
          allLogs.forEach(function(l, i){
            var diff = Math.abs((l.timestamp||0) - markTs);
            if(diff < closestDiff){ closestDiff = diff; closestIdx = i; }
          });
          if(closestIdx >= 0 && allLogs[closestIdx].ph != null){
            phMarkerData[closestIdx] = Number(allLogs[closestIdx].ph);
          }
        });

        datasets.push({
          label: '⚗️ Dosing pH',
          data: phMarkerData,
          borderColor: 'transparent',
          backgroundColor: '#a78bfa',
          showLine: false,
          pointRadius: 6,
          pointHoverRadius: 8,
          pointStyle: 'rectRot',
          pointBorderColor: '#fff',
          pointBorderWidth: 1.5,
          yAxisID: phAxisId2
        });
      }

      chart = new Chart(canvas.getContext('2d'), {
        type:'line',
        data:{labels:labels,datasets:datasets},
        options:{
          responsive:true,
          maintainAspectRatio:false,
          interaction:{mode:'index',intersect:false},
          scales:{
            x:{ticks:{color:'#94a3b8',maxTicksLimit:8},grid:{color:'#1e293b'}},
            ySingle:{display:currentTab!=='all',ticks:{color:'#94a3b8'},grid:{color:'#1e293b'},beginAtZero:false},
            yTds:{display:currentTab==='all',position:'left',ticks:{color:colors.tds},grid:{color:'#1e293b'},beginAtZero:false,title:{display:true,text:'TDS',color:colors.tds}},
            yPh:{display:currentTab==='all',position:'right',ticks:{color:colors.ph},grid:{drawOnChartArea:false},beginAtZero:false,title:{display:true,text:'pH',color:colors.ph}},
            yTemp:{display:false,position:'left',beginAtZero:false,grid:{drawOnChartArea:false}},
            yHumidity:{display:false,position:'right',beginAtZero:false,grid:{drawOnChartArea:false}}
          },
          plugins:{
            legend:{display:currentTab==='all',position:'top',labels:{color:'#cbd5e1',usePointStyle:true,padding:16}},
            tooltip:{backgroundColor:'#07150f',titleColor:'#e2e8f0',bodyColor:'#cbd5e1',borderColor:'#334155',borderWidth:1,padding:10,displayColors:true}
          }
        }
      });
    }

    function loadChartData(dateStr){
      var query;
      if(dateStr){
        var startTs = Math.floor(new Date(dateStr+'T00:00:00').getTime()/1000);
        var endTs = startTs + 86400; // 24 jam
        query = base.child('logs').orderByChild('timestamp').startAt(startTs).endAt(endTs);
        chartTitle.textContent = '📈 Grafik Riwayat (' + new Date(dateStr+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) + ')';
        chartLatestBtn.style.display = '';
      } else {
        query = base.child('logs').orderByKey().limitToLast(200);
        chartTitle.textContent = '📈 Grafik Riwayat (200 terakhir)';
        chartLatestBtn.style.display = 'none';
      }

      query.once('value').then(function(snap){
        allLogs=[];
        snap.forEach(function(c){allLogs.push(c.val());});
        allLogs.sort(function(a,b){return (a.timestamp||0)-(b.timestamp||0);});
        if(allLogs.length === 0 && dateStr){
          showToast('Tidak ada data sensor di tanggal itu');
          dosingMarks = [];
          phMarks = [];
          drawChart();
          return;
        }

        // Ambil kejadian dosing NUTRISI untuk rentang waktu YANG SAMA
        // dengan data sensor yang baru dimuat - supaya titik penandanya
        // pas dan relevan.
        if(allLogs.length === 0){
          dosingMarks = [];
          phMarks = [];
          drawChart();
          return;
        }
        var rangeStart = allLogs[0].timestamp;
        var rangeEnd = allLogs[allLogs.length-1].timestamp;

        base.child('eventLog').orderByChild('timestamp').startAt(rangeStart).endAt(rangeEnd).once('value').then(function(evSnap){
          dosingMarks = [];
          phMarks = [];
          evSnap.forEach(function(c){
            var v = c.val();
            if(v.text && (v.text.indexOf('PUMP A START') >= 0 || v.text.indexOf('PUMP B START') >= 0)){
              dosingMarks.push(v.timestamp);
            }
            if(v.text && (v.text.indexOf('PH UP START') >= 0 || v.text.indexOf('PH DOWN START') >= 0)){
              phMarks.push(v.timestamp);
            }
          });
          drawChart();
        }).catch(function(){
          dosingMarks = [];
          phMarks = [];
          drawChart();
        });
      });
    }

    function loadEventData(dateStr){
      var query;
      if(dateStr){
        var startTs = Math.floor(new Date(dateStr+'T00:00:00').getTime()/1000);
        var endTs = startTs + 86400;
        query = base.child('eventLog').orderByChild('timestamp').startAt(startTs).endAt(endTs);
        eventTitle.textContent = '📋 Riwayat Kejadian (' + new Date(dateStr+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) + ')';
        eventLatestBtn.style.display = '';
      } else {
        query = base.child('eventLog').orderByKey().limitToLast(100);
        eventTitle.textContent = '📋 Riwayat Kejadian';
        eventLatestBtn.style.display = 'none';
      }

      eventList.innerHTML = '';

      query.once('value').then(function(snap){
      var events = [];
      snap.forEach(function(c){ events.push(c.val()); });
      events.sort(function(a,b){ return (a.timestamp||0)-(b.timestamp||0); }); // kronologis untuk pairing

      // Pasangkan START/ON dengan STOP/OFF berikutnya per kategori, supaya
      // durasi bisa dihitung dan ditampilkan di baris STOP/OFF-nya.
      var openStart = {}; // kategori -> timestamp mulai
      var displayRows = [];

      events.forEach(function(ev){
        var text = ev.text || '';
        var m = text.match(/^(.*?)\s(START|STOP|ON|OFF)$/);
        var category = m ? m[1] : null;
        var action = m ? m[2] : null;

        var durationStr = '';
        if(category && (action==='START' || action==='ON')){
          openStart[category] = ev.timestamp;
        } else if(category && (action==='STOP' || action==='OFF') && openStart[category]){
          var durSec = ev.timestamp - openStart[category];
          delete openStart[category];
          if(durSec > 0 && durSec < 86400){
            if(durSec < 60) durationStr = ' (' + durSec + ' detik)';
            else durationStr = ' (' + (durSec/60).toFixed(1) + ' menit)';
          }
        }

        displayRows.push({ timestamp: ev.timestamp, text: text, durationStr: durationStr });
      });

      displayRows.reverse(); // terbaru dulu untuk ditampilkan

      if(displayRows.length === 0){
        eventList.appendChild(el('div','text-xs text-slate-500 text-center py-4','Belum ada kejadian tercatat.'));
        return;
      }

      displayRows.forEach(function(r){
        var row = el('div','flex justify-between items-center text-xs py-1.5 border-b border-slate-800');
        var timeStr = new Date(r.timestamp*1000).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'});
        row.appendChild(el('span','text-slate-500', timeStr));
        row.appendChild(el('span','text-slate-200 font-medium', r.text + r.durationStr));
        eventList.appendChild(row);
      });
      });
    }

    eventDateBtn.onclick = function(){
      if(!eventDateInput.value){ showToast('Pilih tanggal dulu'); return; }
      loadEventData(eventDateInput.value);
    };
    eventLatestBtn.onclick = function(){
      eventDateInput.value = '';
      loadEventData(null);
    };
    function eventShiftDate(days){
      var base = eventDateInput.value ? new Date(eventDateInput.value+'T00:00:00') : new Date();

    var eventBtnRow = el('div','grid grid-cols-1 sm:grid-cols-2 gap-2 mt-3');
    var eventExportBtn = el('button','py-2 rounded-lg bg-[#39ff14] text-black font-bold text-xs','⬇ Export Kejadian ke Excel');
    var eventDeleteBtn = el('button','py-2 rounded-lg bg-slate-800 border border-red-900 text-red-400 font-semibold text-xs','🗑 Hapus Riwayat Kejadian');
    eventDeleteBtn.disabled = true;
    eventDeleteBtn.style.opacity = '.5';
    eventBtnRow.appendChild(eventExportBtn);
    eventBtnRow.appendChild(eventDeleteBtn);
    eventCard.appendChild(eventBtnRow);
    eventCard.appendChild(el('p','text-[11px] text-slate-500 mt-2','Sama seperti riwayat sensor: tombol hapus baru aktif setelah export berhasil.'));

    eventExportBtn.onclick = function(){
      eventExportBtn.disabled = true; eventExportBtn.textContent = 'Mengambil data...';
      base.child('eventLog').once('value').then(function(snap){
        var rows = [];

        var ws = XLSX.utils.json_to_sheet(rows);

        showToast('Export berhasil (' + rows.length + ' baris)');
        eventExportBtn.disabled = false; eventExportBtn.textContent = '⬇ Export Kejadian ke Excel';
        eventDeleteBtn.disabled = false; eventDeleteBtn.style.opacity = '1';
      });
    };

    eventDeleteBtn.onclick = function(){

        eventList.innerHTML = '';
        eventList.appendChild(el('div','text-xs text-slate-500 text-center py-4','Belum ada kejadian tercatat.'));
      }).catch(function(err){ showToast('Gagal: '+err.message); eventDeleteBtn.disabled=false; });
    };


    exportAllBtn.onclick = function(){
      exportAllBtn.disabled = true; exportAllBtn.textContent = 'Mengambil semua data...';
      base.child('logs').once('value').then(function(snap){
        var rows = [];
        snap.forEach(function(c){
          var v = c.val();
          rows.push({
            waktu: new Date(v.timestamp*1000).toLocaleString('id-ID'),
            timestamp_unix: v.timestamp,
            hst: v.hst,
            ph: v.ph, tds: v.tds, roomTemp: v.roomTemp, humidity: v.humidity, waterTemp: v.waterTemp

        if(rows.length === 0){
          showToast('Tidak ada data log untuk diexport');

          return;
        }
        var ws = XLSX.utils.json_to_sheet(rows);
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Riwayat');
        XLSX.writeFile(wb, 'riwayat_' + deviceId + '_' + new Date().toISOString().slice(0,10) + '.xlsx');

        showToast('Export berhasil (' + rows.length + ' baris)');
        exportAllBtn.disabled = false; exportAllBtn.textContent = '⬇ Export Semua Log ke Excel';
        deleteBtn.disabled = false; deleteBtn.style.opacity = '1';
      });

    deleteBtn.onclick = function(){
      if(deleteBtn.disabled) return;
      if(!confirm('Device: ' + deviceId + '\n\nYakin hapus SEMUA log riwayat? Data TIDAK BISA dikembalikan. Pastikan Anda sudah export dan file-nya benar-benar tersimpan.')) return;
      deleteBtn.disabled = true;

    // ---- Semua Tindakan Lapangan (lengkap, bukan cuma 10 terakhir) ----
    var actFullCard = el('div','glass rounded-xl p-4 border border-slate-700 mt-4');
    actFullCard.appendChild(el('h2','text-sm font-semibold text-slate-300 mb-3','📝 Semua Tindakan Lapangan'));
    var actFullList = el('div','space-y-1 max-h-80 overflow-y-auto');
    actFullCard.appendChild(actFullList);
    content.appendChild(actFullCard);

    base.child('fieldActivity').orderByChild('timestamp').once('value').then(function(snap){
      var rows = [];

    // ---- Katalog Pupuk/Nutrisi (referensi permanen) ----
    var fertFullCard = el('div','glass rounded-xl p-4 border border-slate-700 mt-4');

  //================= AUTH STATE =================
  var isAdmin = false;

  // Bungkus promise apa pun dengan batas waktu maksimal - kalau kelamaan
  // (macet menunggu tanpa pernah selesai/gagal), paksa lanjut daripada
  // menahan proses login selamanya. Pengecekan tambahan (jam tidak aktif,
  // status admin) itu PENTING tapi TIDAK BOLEH sampai bikin orang tidak
  // bisa masuk sama sekali kalau salah satunya macet.
  function withTimeout(promise, ms){
    return Promise.race([
      promise,
      new Promise(function(resolve){ setTimeout(resolve, ms); })
    ]);
  }

  auth.onAuthStateChanged(function(user){
    if(user){
      uid = user.uid;

      function proceedToApp(){
        withTimeout(
          db.ref('admins/'+uid).once('value').then(function(s2){ isAdmin = !!s2.val(); }).catch(function(){ isAdmin = false; }),
          5000
        ).then(function(){
          renderShell();
          setupInactivityWatch();
        });
      }

      // Kalau ini login BARU SAJA berhasil secara manual (baru ketik
      // email/password, klik Masuk) - JANGAN cek "sudah lama tidak aktif"
      // sama sekali. Itu jelas-jelas aktivitas baru, terlepas dari catatan
      // waktu LAMA yang mungkin masih tersimpan dari sesi sebelumnya
      // (bisa jadi sudah berhari-hari). Dulu ini yang bikin: login
      // berhasil, tapi LANGSUNG ke-logout otomatis lagi karena pengecekan
      // ini salah kira sesi baru itu "basi" gara-gara catatan waktu lama.
      if(justLoggedInFresh){
        justLoggedInFresh = false;
        // Sengaja diam - heartbeat sama seperti touchActivity(), gagal
        // sesekali tidak kritis, tetap lanjut ke proceedToApp().
        db.ref('users/'+uid+'/lastActivity').set(Date.now()).catch(function(){});
        proceedToApp();
        return;
      }

      // Ini jalur NORMAL (buka halaman, sesi lama masih "diingat" browser)
      // - cek dulu apakah sesi ini sudah kelewat lama tidak aktif SEBELUM
      // render apa pun. Dibatasi waktu maksimal 5 detik - kalau lebih lama
      // dari itu (macet/jaringan lambat), LANJUT SAJA, jangan sampai orang
      // tidak bisa masuk cuma karena pengecekan ini.
      withTimeout(
        db.ref('users/'+uid+'/lastActivity').once('value').then(function(s){
          var last = s.val();
          if(last && (Date.now() - last) > INACTIVITY_LIMIT_MS){
            auth.signOut();
            return 'signedout';
          }
          return 'ok';
        }).catch(function(){ return 'ok'; }),
        5000
      ).then(function(result){
        if(result !== 'signedout') proceedToApp();
      });
    }
    else {
      // Kalau ini terjadi TEPAT setelah login manual baru saja berhasil
      // (justLoggedInFresh masih true) - ini mencurigakan, seharusnya
      // TIDAK terjadi. Kemungkinan race condition sesaat di penyimpanan
      // browser (sering muncul di "cold start" - PC baru nyala/lama tidak
      // dipakai). JANGAN langsung nyerah ke layar login (yang bikin field
      // email/password ke-reset, harus diketik ulang) - coba cek ulang
      // sebentar dulu, siapa tahu cuma race condition sesaat yang segera
      // pulih sendiri.
      if(justLoggedInFresh){
        setTimeout(function(){
          if(auth.currentUser){
            // Ternyata masih login sungguhan - auth.onAuthStateChanged akan
            // terpanggil lagi sendiri dengan user yang benar, tidak perlu
            // apa-apa di sini.
          } else {
            justLoggedInFresh = false;
            renderLogin();
          }
        }, 800);
        return;
      }
      renderLogin();
    }
  });

  //================= PWA SERVICE WORKER =================
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(err){
        console.log('Service worker gagal daftar:', err);
      });
    });
  }
})();
